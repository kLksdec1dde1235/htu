  <div class="wrap">
    <div class="head">
      <h2 data-cms="title">공지사항</h2>
      <a class="more" href="./notice.html"><span data-cms="more">전체 보기</span> <span aria-hidden="true">›</span></a>
    </div>
    <div class="board"><div class="grid"></div></div>
  </div>

  <script>
    (function () {
      var section = document.getElementById('htuNoticeMain');
      if (!section || section.__htuInit) return;
      section.__htuInit = true;
      function htuCms() {
        if (!window.__htuCmsP) {
          window.__htuCmsP = (window.HTU_I18N ? window.HTU_I18N.ready : Promise.resolve()).then(function () { return fetch(String(window.HTU_CMS_ENDPOINT || '').replace(/\/+$/, '') + (window.HTU_I18N ? window.HTU_I18N.q('/api/public/content') : '/api/public/content'), { credentials: 'omit' }); })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        }
        return window.__htuCmsP;
      }
      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
      function fmt(d) {
        var t = new Date(d); if (isNaN(t)) return '';
        return t.toLocaleDateString((window.HTU_I18N && window.HTU_I18N.locale) || 'ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
      }
      htuCms().then(function (data) {
        if (!data) return;
        var st = (data.settings && data.settings.notices_main) || {};
        var rows = data.notices || [];
        if (st.show === false || !rows.length) return;
        section.querySelector('[data-cms="title"]').textContent = st.title || '공지사항';
        section.querySelector('[data-cms="more"]').textContent = st.more_label || '전체 보기';
        if (data.links && data.links.notice) section.querySelector('.more').href = data.links.notice;
        section.querySelector('.grid').innerHTML = rows.map(function (n) {
          // 이미지가 없거나 열리지 않으면 브랜드 색 배경으로
          var thumb = n.img
            ? '<div class="thumb"><span class="ph">Notice</span><img src="' + esc(n.img) + '" alt="' + esc(n.title) + '" loading="lazy" decoding="async" onerror="this.parentNode.classList.add(\'is-empty\');this.remove()">'
            : '<div class="thumb is-empty"><span class="ph">Notice</span>';
          return '<a class="card" href="' + esc(n.link) + '">' + thumb +
              '<span class="chip' + (n.pinned ? ' is-pin' : '') + '">' + (n.pinned ? '공지' : '안내') + '</span>' +
              (n.isNew ? '<span class="new">NEW</span>' : '') + '</div>' +
            '<div class="text"><h3 class="title">' + esc(n.title) + '</h3>' +
              (n.excerpt ? '<p class="excerpt">' + esc(n.excerpt) + '</p>' : '') +
              '<time class="date" datetime="' + esc(n.date) + '">' + fmt(n.date) + '</time></div></a>';
        }).join('');
        section.hidden = false;
      });
    })();
  </script>
</section>

  <div class="wrap">

  <script>
    (function () {
      var section = document.getElementById('youtubePopupGallerySection');
      if (!section || section.__htuInit) return;
      section.__htuInit = true;

      function htuCms() {
        if (window.__HTU_CMS_DATA__) return Promise.resolve(window.__HTU_CMS_DATA__);
        if (!window.__htuCmsP) {
          window.__htuCmsP = (window.HTU_I18N ? window.HTU_I18N.ready : Promise.resolve()).then(function () { return fetch(String(window.HTU_CMS_ENDPOINT || '').replace(/\/+$/, '') + (window.HTU_I18N ? window.HTU_I18N.q('/api/public/content') : '/api/public/content'), { credentials: 'omit' }); })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        }
        return window.__htuCmsP;
      }
      function getYoutubeId(url) {
        if (!url) return '';
        var str = String(url).trim();
        if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;
        var m = str.match(/youtu\.be\/([^?&/]+)/i); if (m && m[1]) return m[1];
        m = str.match(/[?&]v=([^?&/]+)/i); if (m && m[1]) return m[1];
        m = str.match(/youtube\.com\/embed\/([^?&/]+)/i); if (m && m[1]) return m[1];
        m = str.match(/youtube\.com\/shorts\/([^?&/]+)/i); if (m && m[1]) return m[1];
        m = str.match(/youtube\.com\/live\/([^?&/]+)/i); if (m && m[1]) return m[1];
        return '';
      }
      function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
        return a;
      }

      htuCms().then(function (data) {
        data = data || {};
        var st = (data.settings && data.settings.gallery) || {};
        var items = (data.gallery || []).filter(function (v) { return getYoutubeId(v.youtube_url); });
        if (!items.length) { section.style.display = 'none'; return; }
        if (st.shuffle) items = shuffle(items);
        section.querySelector('[data-cms="title"]').textContent = st.title || 'YouTube Video';
        init(items, st);
      });

      function init(items, st) {
        var track = section.querySelector('#ytPopupTrack');
        var tpl = section.querySelector('#ytPopupTemplate');
        var btnPrev = section.querySelector('#ytPopupPrev');
        var btnNext = section.querySelector('#ytPopupNext');
        var moreBtn = section.querySelector('#ytPopupMoreBtn');
        var popup = section.querySelector('#ytPopupModal');
        var popupClose = section.querySelector('#ytPopupClose');
        var popupFrame = section.querySelector('#ytPopupFrame');
        var mobileMq = window.matchMedia('(max-width: 900px)');
        var showTitle = !!st.show_title;
        var interval = Number(st.auto_interval) || 4200;

        var currentPage = 0;
        var pageCount = 1;
        var autoTimer = null;
        var mobileVisibleCount = 5;
        var dragStartX = 0;
        var isDragging = false;
        var dragMoved = false;
        var isAnimating = false;

        function isMobile() { return mobileMq.matches; }
        function getPageSize() { return 6; }
        function getThumbUrl(id) { return id ? 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg' : ''; }
        function getEmbedUrl(id) { return id ? 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0&playsinline=1' : ''; }

        function buildSlide(item) {
          var videoId = getYoutubeId(item.youtube_url);
          if (!videoId) return null;
          var node = tpl.content.cloneNode(true);
          var slide = node.querySelector('.slide');
          var btn = node.querySelector('.slide-btn');
          var img = node.querySelector('img');
          img.loading = 'lazy'; img.decoding = 'async';
          img.src = getThumbUrl(videoId);
          img.alt = item.title ? item.title : 'youtube thumbnail';
          btn.setAttribute('data-video-id', videoId);
          btn.setAttribute('aria-label', (item.title ? item.title + ' - ' : '') + '유튜브 영상 열기');
          if (showTitle && (item.title || item.excerpt)) {
            var text = node.querySelector('.text');
            text.hidden = false;
            text.querySelector('.title').textContent = item.title || '';
            text.querySelector('.excerpt').textContent = item.excerpt || '';
          }
          btn.addEventListener('click', function () {
            if (dragMoved) return;
            openPopup(videoId, item.title || '');
          });
          return slide;
        }

        function buildPage(pageIndex) {
          var start = pageIndex * getPageSize();
          var page = document.createElement('div');
          page.className = 'page';
          items.slice(start, start + getPageSize()).forEach(function (item) {
            var s = buildSlide(item);
            if (s) page.appendChild(s);
          });
          return page;
        }

        function setTrackHeightFrom(el) {
          if (!el) return;
          var h = el.offsetHeight;
          if (h > 0) track.style.height = h + 'px';
        }

        function syncButtons() {
          var multi = Math.ceil(items.length / getPageSize()) > 1;
          if (isMobile() || !multi) {
            if (btnPrev) btnPrev.style.display = 'none';
            if (btnNext) btnNext.style.display = 'none';
            return;
          }
          if (btnPrev) { btnPrev.style.display = ''; btnPrev.disabled = isAnimating; }
          if (btnNext) { btnNext.style.display = ''; btnNext.disabled = isAnimating; }
        }

        function syncMoreButton() {
          if (!moreBtn) return;
          if (!isMobile()) { moreBtn.hidden = true; return; }
          moreBtn.hidden = mobileVisibleCount >= items.length;
        }

        function renderMobile() {
          isAnimating = false;
          track.classList.add('is-mobile');
          track.innerHTML = '';
          items.slice(0, mobileVisibleCount).forEach(function (item) {
            var s = buildSlide(item);
            if (s) track.appendChild(s);
          });
          track.style.height = '';
          syncButtons();
          syncMoreButton();
        }

        function renderDesktopInitial() {
          track.classList.remove('is-mobile');
          pageCount = Math.max(1, Math.ceil(items.length / getPageSize()));
          if (currentPage > pageCount - 1) currentPage = pageCount - 1;
          if (currentPage < 0) currentPage = 0;
          track.innerHTML = '';
          var page = buildPage(currentPage);
          page.classList.add('is-active');
          track.appendChild(page);
          requestAnimationFrame(function () { setTrackHeightFrom(page); });
          syncButtons();
          syncMoreButton();
        }

        function transitionToPage(nextPageIndex, direction) {
          if (isMobile() || isAnimating) return;
          pageCount = Math.max(1, Math.ceil(items.length / getPageSize()));
          nextPageIndex = Math.max(0, Math.min(pageCount - 1, nextPageIndex));
          var currentEl = track.querySelector('.page.is-active');
          if (!currentEl) { currentPage = nextPageIndex; renderDesktopInitial(); return; }
          if (nextPageIndex === currentPage) { syncButtons(); return; }

          isAnimating = true;
          syncButtons();
          var nextEl = buildPage(nextPageIndex);
          nextEl.classList.add('is-abs');
          var enterFrom = direction === 1 ? '100%' : '-100%';
          var leaveTo = direction === 1 ? '-100%' : '100%';
          currentEl.classList.add('is-abs');
          currentEl.style.transform = 'translate3d(0,0,0)';
          nextEl.style.transform = 'translate3d(' + enterFrom + ',0,0)';
          track.appendChild(nextEl);
          track.style.height = Math.max(currentEl.offsetHeight || 0, nextEl.offsetHeight || 0) + 'px';

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              currentEl.style.transform = 'translate3d(' + leaveTo + ',0,0)';
              nextEl.style.transform = 'translate3d(0,0,0)';
            });
          });

          var done = false;
          function cleanup() {
            if (done) return;
            done = true;
            currentPage = nextPageIndex;
            currentEl.remove();
            nextEl.classList.remove('is-abs');
            nextEl.classList.add('is-active');
            nextEl.style.transform = 'translate3d(0,0,0)';
            nextEl.style.position = '';
            nextEl.style.inset = '';
            setTrackHeightFrom(nextEl);
            isAnimating = false;
            syncButtons();
            syncMoreButton();
          }
          nextEl.addEventListener('transitionend', function onEnd(e) {
            if (e.propertyName !== 'transform') return;
            nextEl.removeEventListener('transitionend', onEnd);
            cleanup();
          });
          setTimeout(cleanup, 900);
        }

        function render() { if (isMobile()) renderMobile(); else renderDesktopInitial(); }
        function next() {
          if (isMobile() || isAnimating || pageCount < 2) return;
          transitionToPage(currentPage >= pageCount - 1 ? 0 : currentPage + 1, 1);
        }
        function prev() {
          if (isMobile() || isAnimating || pageCount < 2) return;
          transitionToPage(currentPage <= 0 ? pageCount - 1 : currentPage - 1, -1);
        }
        function stopAuto() { if (autoTimer) clearInterval(autoTimer); autoTimer = null; }
        function startAuto() {
          stopAuto();
          if (isMobile() || interval <= 0) return;
          autoTimer = setInterval(function () { if (!isAnimating) next(); }, interval);
        }
        function onMore() { mobileVisibleCount += 5; renderMobile(); }

        function openPopup(videoId, title) {
          popupFrame.src = getEmbedUrl(videoId);
          popup.classList.add('is-open');
          popup.setAttribute('aria-hidden', 'false');
          if (title) popupFrame.setAttribute('title', title);
          document.documentElement.style.overflow = 'hidden';
          stopAuto();
        }
        function closePopup() {
          popup.classList.remove('is-open');
          popup.setAttribute('aria-hidden', 'true');
          popupFrame.src = '';
          document.documentElement.style.overflow = '';
        }

        function onPointerDown(e) {
          if (isMobile() || isAnimating) return;
          dragStartX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          isDragging = true;
          dragMoved = false;
        }
        function onPointerMove(e) {
          if (!isDragging || isMobile()) return;
          var x = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          if (Math.abs(x - dragStartX) > 12) dragMoved = true;
        }
        function onPointerUp(e) {
          if (!isDragging || isMobile() || isAnimating) return;
          var endX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX) || 0;
          var diff = endX - dragStartX;
          if (Math.abs(diff) > 60) { if (diff < 0) next(); else prev(); }
          isDragging = false;
          setTimeout(function () { dragMoved = false; }, 0);
        }

        if (btnPrev) btnPrev.addEventListener('click', prev);
        if (btnNext) btnNext.addEventListener('click', next);
        if (moreBtn) moreBtn.addEventListener('click', onMore);
        if (popupClose) popupClose.addEventListener('click', closePopup);
        popup.addEventListener('click', function (e) { if (e.target === popup) closePopup(); });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && popup.classList.contains('is-open')) closePopup();
        });
        section.addEventListener('mouseenter', stopAuto);
        section.addEventListener('mouseleave', startAuto);
        track.addEventListener('mousedown', onPointerDown);
        track.addEventListener('mousemove', onPointerMove);
        track.addEventListener('touchstart', onPointerDown, { passive: true });
        track.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchend', onPointerUp);

        var resizeTimer = null;
        var wasMobile = isMobile();
        window.addEventListener('resize', function () {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function () {
            var nowMobile = isMobile();
            if (nowMobile && !wasMobile) mobileVisibleCount = 5;
            wasMobile = nowMobile;
            isAnimating = false;
            render();
            startAuto();
          }, 120);
        });

        render();
        startAuto();
      }
    })();
  </script>
</section>

  <div class="mps-backdrop" aria-hidden="true"></div>

  <div class="mps-overlay">
    <div class="mps-dialog" data-mps-dialog role="dialog" aria-modal="true" aria-label="공지 팝업">
      <div class="mps-slider-wrap">
        <div class="mps-track" data-mps-track></div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      var S = document.getElementById('medicalPopupNoticeSection');
      if(!S || S.__mpsBound) return;
      S.__mpsBound = true;

      function htuCms(){
        if(window.__HTU_CMS_DATA__) return Promise.resolve(window.__HTU_CMS_DATA__);
        if(!window.__htuCmsP){
          window.__htuCmsP = (window.HTU_I18N ? window.HTU_I18N.ready : Promise.resolve()).then(function () { return fetch(String(window.HTU_CMS_ENDPOINT || '').replace(/\/+$/, '') + (window.HTU_I18N ? window.HTU_I18N.q('/api/public/content') : '/api/public/content'), { credentials: 'omit' }); })
            .then(function(r){ return r.ok ? r.json() : null; })
            .catch(function(){ return null; });
        }
        return window.__htuCmsP;
      }
      function esc(s){
        return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
          return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
        });
      }

      var KEY = 'medicalPopupNoticeSectionHideUntil';
      function isHiddenToday(){
        try{ var v = localStorage.getItem(KEY); return v && Number(v) > Date.now(); }catch(e){ return false; }
      }
      if(isHiddenToday()) return;

      htuCms().then(function(data){
        data = data || {};
        var st = (data.settings && data.settings.popup) || {};
        var now = Date.now();
        var list = (data.popups || []).filter(function(p){
          if(p.starts_at && new Date(p.starts_at).getTime() > now) return false;
          if(p.ends_at && new Date(p.ends_at).getTime() < now) return false;
          return true;
        });
        if(!list.length) return;
        build(list, st);
      });

      function build(list, st){
        S.setAttribute('data-align', st.align === 'center' ? 'center' : 'left');
        var CHECK = '<span class="mps-check-circle" aria-hidden="true"><svg viewBox="0 0 34 34"><circle class="ck-ring" cx="17" cy="17" r="15.5"></circle><polyline class="ck-mark" points="10.5,17.5 14.8,22 23.5,12.5"></polyline></svg></span>';

        S.querySelector('[data-mps-track]').innerHTML = list.map(function(p, n){
          var target = p.link_new_tab ? ' target="_blank" rel="noopener noreferrer"' : '';
          var media;
          if(p.image_url){
            var img = '<img class="mps-card-image" src="' + esc(p.image_url) + '" alt="' + esc(p.title || ('팝업 이미지 ' + (n + 1))) + '" data-mps-img>';
            media = p.link_url
              ? '<a class="mps-card-link" href="' + esc(p.link_url) + '"' + target + ' aria-label="' + esc(p.title || '팝업') + '">' + img + '</a>'
              : '<div class="mps-card-link">' + img + '</div>';
          }else{
            var inner = (p.title ? '<h3>' + esc(p.title) + '</h3>' : '') + (p.body_html ? '<p>' + p.body_html + '</p>' : '') +
              (p.link_url ? '<span class="mps-more">' + esc(p.link_label || '자세히 보기') + ' →</span>' : '');
            media = p.link_url
              ? '<a class="mps-text" data-mps-text href="' + esc(p.link_url) + '"' + target + '>' + inner + '</a>'
              : '<div class="mps-text" data-mps-text>' + inner + '</div>';
          }
          return '<article class="mps-card"><div class="mps-card-frame" data-mps-frame>' + media +
            '<div class="mps-footer">' +
              '<div class="mps-footer-left"><button class="mps-hide-btn" type="button" data-mps-hide aria-pressed="false" title="오늘 하루 팝업 보지 않기">' + CHECK + '<span class="mps-hide-label">오늘 보지 않기</span></button></div>' +
              '<div class="mps-footer-center">' + (list.length > 1 ? (n + 1) + ' / ' + list.length : '') + '</div>' +
              '<div class="mps-footer-right"><button class="mps-close-btn" type="button" data-mps-close aria-label="닫기"><span class="mps-close-icon" aria-hidden="true"></span></button></div>' +
            '</div></div></article>';
        }).join('');

        init(st);
      }

      /* ===== 아래부터 원본 팝업 로직 ===== */
      function init(st){
        var CFG = window.MPS_CONFIG || {
          PC:     { maxW: Number(st.pc_max_w) || 540, maxH: Number(st.pc_max_h) || 720, footerH: 88 },
          TABLET: { maxW: 340, maxH: 490, footerH: 72 },
          MOBILE: { maxW: 320, maxH: 630, footerH: 70 }
        };
        var PC = CFG.PC, TABLET = CFG.TABLET, MOBILE = CFG.MOBILE;
        function getSize(){
          var w = window.innerWidth;
          if(w <= 420) return MOBILE;
          if(w <= 860) return TABLET;
          return PC;
        }

        var track    = S.querySelector('[data-mps-track]');
        var cards    = [].slice.call(S.querySelectorAll('.mps-card'));
        var hideBtns = [].slice.call(S.querySelectorAll('[data-mps-hide]'));
        var closeBtns= [].slice.call(S.querySelectorAll('[data-mps-close]'));
        var backdrop = S.querySelector('.mps-backdrop');
        var idx = 0, perView = 1, maxIdx = 0, hideChecked = false;

        function fitFrames(){
          var size = getSize();
          var maxW = size.maxW, footerH = size.footerH, imgMaxH = size.maxH - footerH;
          [].slice.call(S.querySelectorAll('[data-mps-frame]')).forEach(function(frame){
            var img    = frame.querySelector('[data-mps-img]');
            var text   = frame.querySelector('[data-mps-text]');
            var footer = frame.querySelector('.mps-footer');
            if(footer) footer.style.height = footerH + 'px';
            if(text){
              frame.style.width = maxW + 'px';
              text.style.maxHeight = imgMaxH + 'px';
              return;
            }
            if(!img) return;
            var nw = img.naturalWidth  || maxW;
            var nh = img.naturalHeight || imgMaxH;
            var ratio = nw / nh;
            var fitW = maxW, fitH = fitW / ratio;
            if(fitH > imgMaxH){ fitH = imgMaxH; fitW = fitH * ratio; }
            fitW = Math.floor(fitW); fitH = Math.floor(fitH);
            frame.style.width = fitW + 'px';
            img.style.width   = fitW + 'px';
            img.style.height  = fitH + 'px';
          });
        }

        function waitImagesAndFit(){
          var imgs = [].slice.call(S.querySelectorAll('[data-mps-img]'));
          var loaded = 0, total = imgs.length;
          function done(){ fitFrames(); render(); S.classList.remove('mps-hidden'); }
          if(total === 0){ done(); return; }
          function check(){ loaded++; if(loaded >= total) done(); }
          imgs.forEach(function(img){
            if(img.complete && img.naturalWidth > 0) check();
            else{ img.addEventListener('load', check, {once:true}); img.addEventListener('error', check, {once:true}); }
          });
        }

        function saveHideToday(){
          try{ var d = new Date(); d.setHours(23,59,59,999); localStorage.setItem(KEY, String(d.getTime())); }catch(e){}
        }
        function closePopup(){
          if(hideChecked) saveHideToday();
          S.classList.add('mps-closing');
          setTimeout(function(){ S.classList.remove('mps-closing'); S.classList.add('mps-hidden'); }, 360);
        }
        function calc(){ perView = 1; maxIdx = Math.max(0, cards.length - perView); if(idx > maxIdx) idx = maxIdx; }
        function render(){
          calc();
          var w = cards[0] ? cards[0].getBoundingClientRect().width : 0;
          track.style.transform = 'translate3d(' + (-(w) * idx) + 'px,0,0)';
        }

        var sliderWrap = S.querySelector('.mps-slider-wrap');
        var dragState = { active:false, startX:0, startY:0, currentX:0, baseOffset:0, dirLocked:false, isHorizontal:false, moved:false };
        var SWIPE_THRESHOLD = 40;
        function getBaseOffset(){ var w = cards[0] ? cards[0].getBoundingClientRect().width : 0; return -(w) * idx; }
        function setTrackPos(px){ track.style.transform = 'translate3d(' + px + 'px,0,0)'; }

        function onDragStart(x, y){
          if(cards.length <= 1) return;
          dragState.active = true; dragState.startX = x; dragState.startY = y; dragState.currentX = x;
          dragState.baseOffset = getBaseOffset(); dragState.dirLocked = false; dragState.isHorizontal = false; dragState.moved = false;
          track.classList.add('is-dragging'); sliderWrap.classList.add('is-dragging');
        }
        function onDragMove(x, y, evt){
          if(!dragState.active) return;
          var dx = x - dragState.startX, dy = y - dragState.startY;
          if(!dragState.dirLocked && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){
            dragState.dirLocked = true; dragState.isHorizontal = Math.abs(dx) >= Math.abs(dy);
          }
          if(dragState.dirLocked && !dragState.isHorizontal) return;
          if(dragState.dirLocked && dragState.isHorizontal){ dragState.moved = true; if(evt.cancelable) evt.preventDefault(); }
          dragState.currentX = x;
          var raw = dx;
          if((idx <= 0 && raw > 0) || (idx >= maxIdx && raw < 0)) raw = raw * 0.3;
          setTrackPos(dragState.baseOffset + raw);
        }
        function onDragEnd(){
          if(!dragState.active) return;
          dragState.active = false;
          track.classList.remove('is-dragging'); sliderWrap.classList.remove('is-dragging');
          var dx = dragState.currentX - dragState.startX;
          if(Math.abs(dx) > SWIPE_THRESHOLD){
            if(dx < 0 && idx < maxIdx) idx++;
            else if(dx > 0 && idx > 0) idx--;
          }
          render();
        }

        sliderWrap.addEventListener('touchstart', function(e){ if(e.touches.length !== 1) return; onDragStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
        sliderWrap.addEventListener('touchmove', function(e){ if(e.touches.length !== 1) return; onDragMove(e.touches[0].clientX, e.touches[0].clientY, e); }, {passive:false});
        sliderWrap.addEventListener('touchend', onDragEnd, {passive:true});
        sliderWrap.addEventListener('touchcancel', onDragEnd, {passive:true});
        sliderWrap.addEventListener('mousedown', function(e){
          if(cards.length <= 1 || e.target.closest('button')) return;
          e.preventDefault(); onDragStart(e.clientX, e.clientY);
        });
        document.addEventListener('mousemove', function(e){ if(!dragState.active) return; onDragMove(e.clientX, e.clientY, e); });
        document.addEventListener('mouseup', onDragEnd);
        /* 드래그 직후 링크 클릭 방지 */
        track.addEventListener('click', function(e){
          if(dragState.moved && e.target.closest('a')){ e.preventDefault(); dragState.moved = false; }
        }, true);

        if(backdrop) backdrop.addEventListener('click', function(e){ e.preventDefault(); closePopup(); });

        /* '오늘 보지 않기' 는 모든 카드에서 같은 상태로 동기화 */
        hideBtns.forEach(function(btn){
          btn.addEventListener('click', function(e){
            e.preventDefault(); e.stopPropagation();
            hideChecked = !hideChecked;
            hideBtns.forEach(function(b){
              b.classList.toggle('is-checked', hideChecked);
              b.setAttribute('aria-pressed', hideChecked ? 'true' : 'false');
            });
          });
        });
        closeBtns.forEach(function(btn){ btn.addEventListener('click', function(e){ e.preventDefault(); closePopup(); }); });
        document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !S.classList.contains('mps-hidden')) closePopup(); });

        var resizeTimer;
        window.addEventListener('resize', function(){
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function(){ fitFrames(); render(); }, 100);
        }, {passive:true});

        waitImagesAndFit();
      }
    })();
  </script>
</section>
