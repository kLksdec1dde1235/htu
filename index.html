    <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 12"><path d="M3 2l9 8 9-8"></path></svg></span>
  </button>

  <script>
    (function () {
      var root = document.querySelector('#nwHero');
      if (!root || root.__htuInit) return;
      root.__htuInit = true;

      function htuCms() {
        if (window.__HTU_CMS_DATA__) return Promise.resolve(window.__HTU_CMS_DATA__);
        if (!window.__htuCmsP) {
          window.__htuCmsP = (window.HTU_I18N ? window.HTU_I18N.ready : Promise.resolve()).then(function () { return fetch(String(window.HTU_CMS_ENDPOINT || '').replace(/\/+$/, '') + (window.HTU_I18N ? window.HTU_I18N.q('/api/public/content') : '/api/public/content'), { credentials: 'omit' }); })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        }
        return window.__htuCmsP;
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function loadVimeoApi() {
        if (window.Vimeo && window.Vimeo.Player) return Promise.resolve();
        if (window.__nwVimeoP) return window.__nwVimeoP;
        window.__nwVimeoP = new Promise(function (resolve) {
          var s = document.createElement('script');
          s.src = 'https://player.vimeo.com/api/player.js';
          s.onload = resolve;
          s.onerror = resolve;
          document.head.appendChild(s);
        });
        return window.__nwVimeoP;
      }

      /* 스크롤 힌트 → 다음 섹션으로 */
      root.querySelector('.scrollHint').addEventListener('click', function () {
        var r = root.getBoundingClientRect();
        window.scrollTo({ top: r.bottom + window.pageYOffset, behavior: 'smooth' });
      });

      htuCms().then(function (data) {
        data = data || {};
        var st = (data.settings && data.settings.intro) || {};
        var list = data.intro || [];
        if (!list.length) { root.setAttribute('data-empty', ''); return; }
        if (st.video_pos) root.setAttribute('data-video-pos', st.video_pos);
        if (st.show_scroll_hint === false) root.querySelector('.scrollHint').style.display = 'none';
        render(list);
        var needVimeo = list.some(function (s) { return s.type === 'video'; });
        (needVimeo ? loadVimeoApi() : Promise.resolve()).then(function () { start(Number(st.duration) || 6000); });
      });

      function render(list) {
        root.querySelector('.slides').innerHTML = list.map(function (s, n) {
          var frame = '';
          if (s.type === 'local-video') {
            frame = '<video muted playsinline webkit-playsinline autoplay loop preload="auto" style="width:100%;height:100%;object-fit: cover;"></video>';
          } else if (s.type === 'video') {
            frame = '<iframe src="https://player.vimeo.com/video/' + esc(s.vimeo_id) +
              '?background=1&mute=1&muted=1&autoplay=1&loop=1&playsinline=1&autopause=0" allow="autoplay; fullscreen" title="' + esc(s.eyebrow || 'video') + ' ' + (n + 1) + '"></iframe>';
          }
          return '<div class="slide" data-type="' + esc(s.type) + '" data-poster="' + esc(s.poster_url || '') + '"' +
            (s.type === 'local-video' ? ' data-local-src="' + esc(s.video_url) + '"' : '') + '>' +
            '<div class="media"><div class="vimeoCover">' +
              '<div class="vimeoPoster" aria-hidden="true"></div>' +
              '<div class="vimeoFrame" aria-hidden="true">' + frame + '</div>' +
            '</div></div></div>';
        }).join('');

        var slideEls = root.querySelectorAll('.slide');
        list.forEach(function (s, n) {
          slideEls[n].dataset.eyebrow = s.eyebrow ? esc(s.eyebrow) : '';
          slideEls[n].dataset.title = s.title_html || '';
          /* 이미지 슬라이드: 포스터를 바로 보이게 */
          if (s.type === 'image') slideEls[n].dataset.videoReadyOnce = '0';
        });
      }

      /* ===== 아래부터 원본 슬라이드 로직 (재생 감시 포함) ===== */
      function start(DUR) {
        var slides = Array.from(root.querySelectorAll('.slide'));
        var content = root.querySelector('.content');
        var eyebrow = root.querySelector('.eyebrow');
        var title = root.querySelector('.title');

        var i = 0;
        var timer = null;
        var playerMap = new Map();
        var localVideoMap = new Map();
        var userUnlocked = false;
        var watchdog = null;
        var lastKick = 0;

        function isVisible() { return document.visibilityState === 'visible' && !document.hidden; }

        function injectPreloadVideoOnce(href) {
          try {
            if (!href) return;
            var head = document.head || document.getElementsByTagName('head')[0];
            if (!head) return;
            var key = 'nw-preload-' + href;
            if (document.getElementById(key)) return;
            var link = document.createElement('link');
            link.id = key; link.rel = 'preload'; link.as = 'video'; link.href = href; link.type = 'video/mp4';
            link.setAttribute('fetchpriority', 'high');
            head.appendChild(link);
          } catch (e) { }
        }

        function updateText(slide) {
          eyebrow.innerHTML = slide.dataset.eyebrow || '';
          title.innerHTML = slide.dataset.title || '';
          content.classList.remove('text-in');
          void content.offsetWidth;
          content.classList.add('text-in');
        }

        function setPoster(slide) {
          var posterUrl = slide.dataset.poster || '';
          var posterEl = slide.querySelector('.vimeoPoster');
          if (posterEl && posterUrl && !posterEl.style.backgroundImage) {
            posterEl.style.backgroundImage = 'url("' + posterUrl.replace(/"/g, '%22') + '")';
          }
        }

        function markVideoReadyOnce(slide) {
          slide.dataset.videoReadyOnce = '1';
          slide.classList.add('video-ready');
        }

        function ensureLocalVideo(slide) {
          if (localVideoMap.has(slide)) return localVideoMap.get(slide);
          var video = slide.querySelector('video');
          if (!video) return null;

          video.muted = true; video.defaultMuted = true; video.playsInline = true;
          video.loop = true; video.autoplay = true; video.preload = 'auto';
          video.setAttribute('playsinline', ''); video.setAttribute('webkit-playsinline', '');
          video.setAttribute('muted', ''); video.setAttribute('autoplay', ''); video.setAttribute('loop', '');
          video.setAttribute('preload', 'auto'); video.setAttribute('fetchpriority', 'high');
          video.setAttribute('x5-playsinline', ''); video.setAttribute('x-webkit-airplay', 'deny');
          try { video.disablePictureInPicture = true; } catch (e) { }

          var src = slide.dataset.localSrc || '';
          if (src && !video.getAttribute('src')) video.setAttribute('src', src);

          var onReady = function () { markVideoReadyOnce(slide); };
          try {
            if (typeof video.requestVideoFrameCallback === 'function') {
              video.requestVideoFrameCallback(function () { markVideoReadyOnce(slide); });
            }
          } catch (e) { }
          video.addEventListener('loadeddata', onReady, { once: true });
          video.addEventListener('canplay', onReady, { once: true });
          video.addEventListener('playing', onReady, { once: true });

          video.addEventListener('pause', function () {
            if (!slide.classList.contains('active')) return;
            if (!isVisible()) return;
            var now = Date.now();
            if (now - lastKick < 600) return;
            lastKick = now;
            tryPlayLocal({ video: video }).catch(function () { });
          });

          try { video.load(); } catch (e) { }
          var entry = { video: video };
          localVideoMap.set(slide, entry);
          return entry;
        }

        function tryPlayLocal(entry) {
          return new Promise(function (resolve) {
            try {
              if (entry.video && entry.video.readyState < 2) { try { entry.video.load(); } catch (e) { } }
              var p = entry.video.play();
              if (p && typeof p.then === 'function') p.then(function () { resolve(true); }, function () { resolve(false); });
              else resolve(true);
            } catch (e) { resolve(false); }
          });
        }

        function playLocalVideo(slide) {
          if (slide.dataset.videoReadyOnce === '1') slide.classList.add('video-ready');
          else setPoster(slide);
          var src = slide.dataset.localSrc || '';
          if (src) injectPreloadVideoOnce(src);
          var entry = ensureLocalVideo(slide);
          if (entry) tryPlayLocal(entry);
        }

        function pauseLocalVideo(slide) {
          var entry = localVideoMap.get(slide);
          if (entry && entry.video) { try { entry.video.pause(); } catch (e) { } }
          if (slide.dataset.videoReadyOnce !== '1') slide.classList.remove('video-ready');
        }

        function ensureVimeoPlayer(slide) {
          if (playerMap.has(slide)) return playerMap.get(slide);
          var iframe = slide.querySelector('iframe');
          if (!iframe || !window.Vimeo) return null;
          var player = new Vimeo.Player(iframe);
          player.setVolume(0).catch(function () { });
          player.on('playing', function () { markVideoReadyOnce(slide); });
          var entry = { player: player, readyPromise: player.ready().catch(function () { return null; }) };
          playerMap.set(slide, entry);
          return entry;
        }

        function tryPlayVimeo(entry, slide) {
          return entry.player.play().then(function () {
            entry.player.getPaused().then(function (paused) { if (!paused) markVideoReadyOnce(slide); });
            return true;
          }, function () { return false; });
        }

        function playVimeo(slide) {
          if (slide.dataset.videoReadyOnce === '1') slide.classList.add('video-ready');
          else setPoster(slide);
          var entry = ensureVimeoPlayer(slide);
          if (!entry) return;
          entry.readyPromise.then(function () { tryPlayVimeo(entry, slide); });
        }

        function pauseVimeo(slide) {
          var entry = playerMap.get(slide);
          if (entry) entry.player.pause().catch(function () { });
          if (slide.dataset.videoReadyOnce !== '1') slide.classList.remove('video-ready');
        }

        function playSlide(s) {
          if (s.dataset.type === 'local-video') playLocalVideo(s);
          else if (s.dataset.type === 'video') playVimeo(s);
          else setPoster(s);
        }
        function pauseSlide(s) {
          if (s.dataset.type === 'local-video') pauseLocalVideo(s);
          else if (s.dataset.type === 'video') pauseVimeo(s);
        }

        function show(n) {
          i = (n + slides.length) % slides.length;
          slides.forEach(function (s, idx) {
            var active = (idx === i);
            s.classList.toggle('active', active);
            if (active) { updateText(s); playSlide(s); }
            else pauseSlide(s);
          });
        }

        function nextSlide() { show(i + 1); }

        function unlockAndPlay() {
          if (userUnlocked) return;
          userUnlocked = true;
          var active = slides[i];
          if (active) playSlide(active);
        }

        function startWatchdog() {
          if (watchdog) clearInterval(watchdog);
          watchdog = setInterval(function () {
            if (!isVisible()) return;
            var active = slides[i];
            if (!active || !active.classList.contains('active')) return;
            if (active.dataset.type === 'local-video') {
              var entry = localVideoMap.get(active) || ensureLocalVideo(active);
              if (!entry || !entry.video) return;
              var v = entry.video;
              var shouldResume = v.paused && !v.ended && !v.seeking && (v.currentTime > 0 || v.readyState >= 2);
              if (shouldResume) {
                var now = Date.now();
                if (now - lastKick < 900) return;
                lastKick = now;
                tryPlayLocal(entry);
              }
            }
          }, 900);
        }

        slides.forEach(function (s, idx) {
          setPoster(s);
          if (s.dataset.type === 'local-video') {
            var src = s.dataset.localSrc || '';
            if (src) injectPreloadVideoOnce(src);
            var entry = ensureLocalVideo(s);
            if (entry && entry.video && idx === 0) {
              try { entry.video.load(); } catch (e) { }
              tryPlayLocal(entry);
            }
          } else if (s.dataset.type === 'video') {
            ensureVimeoPlayer(s);
          }
        });

        show(0);
        if (slides.length > 1) timer = setInterval(nextSlide, DUR);
        startWatchdog();

        root.addEventListener('touchstart', unlockAndPlay, { passive: true, once: true });
        root.addEventListener('pointerdown', unlockAndPlay, { passive: true, once: true });
        root.addEventListener('click', unlockAndPlay, { passive: true, once: true });

        function resume() { var a = slides[i]; if (a) playSlide(a); }
        window.addEventListener('pageshow', resume);
        window.addEventListener('focus', resume);
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') resume(); });
      }
    })();
  </script>

        if (dd) dd.innerHTML = st.intro_body_html || '';

        var bg = root.querySelector('.main-slider-bg');
        var list = root.querySelector('.main-slider-list');
        if (!slidesData.length) { s2.setAttribute('data-empty', ''); return; }

        s2.style.height = (slidesData.length * 100) + 'vh';

        bg.innerHTML = slidesData.map(function (s, i) {
          return '<img src="' + esc(s.image_url) + '" alt="' + esc(s.title_text || '') + '" decoding="async"' + (i === 0 ? ' class="active"' : ' loading="lazy"') + '>';

          if (s.title_html) html += '<h4>' + s.title_html + '</h4>';

      /* ---------- 슬라이더 (원본 로직 유지) ---------- */
      function initSlider() {
        var root = document.getElementById('main-slider-root');

        if (!root) return;

        var s1 = root.querySelector('.main-slider-section1');

        var slides = root.querySelectorAll('.main-slider-list li');

            img.classList.remove('permanent-active');
            if (i === 0) {
              img.classList.add('active');
              img.style.transform = 'scale(' + curScale + ')';
            }
          });
        }

        initializeImages();
        slides[0].classList.add('active');
        permanentBgLayer.classList.remove('active');
        permanentBgLayer.classList.remove('permanent');

            });
          }

          texts.forEach(function (_, i) {
            var center = s2Top + viewH * i + viewH / 2;
            var dist = ((y + viewH / 2) - center) / viewH;
            if (dist < -FADE_START) states[i] = { op: 0, y: MAX_Y };
            else if (dist < -FADE_END) {
              var p = (dist + FADE_START) / (FADE_START - FADE_END);
              states[i] = { op: p, y: MAX_Y * (1 - p) };
            } else states[i] = { op: 1, y: 0 };
          });

          root.classList.toggle('s1-out', s1.getBoundingClientRect().bottom < viewH / 2);
        }

        function setActive(on) {
          if (on === active) return;
          active = on;
          root.classList.toggle('inview', on);
          if (on) {
            addEventListener('scroll', updateStates, { passive: true });
            addEventListener('resize', updateStates);
            updateStates();
            rafId = requestAnimationFrame(animate);
          } else {
            removeEventListener('scroll', updateStates);
            removeEventListener('resize', updateStates);
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
          }
        }

        function applyFade(rect, viewH) {
          var START_LINE = viewH;
          var SPAN = viewH * 0.7;
          var dist = START_LINE - rect.bottom;
          var ratio = dist <= 0 ? 0 : Math.min(0.7, dist / SPAN);
          fades.forEach(function (el) {
            if (permanentBackgroundActive && el.closest('#permanent-bg-layer')) return;
            el.style.opacity = Math.max(0, 1 - ratio);
          });
        }

        function checkPos() {
          var r = root.getBoundingClientRect();
          var v = vh();
          setActive((r.top <= 0) && (r.bottom > 0));
          root.classList.toggle('clip', r.bottom <= v * 0.8);
          applyFade(r, v);
        }

        addEventListener('scroll', checkPos, { passive: true });
        addEventListener('resize', checkPos);
        window.addEventListener('load', checkPos);
        initializeImages();
        checkPos();
      }

      /* ---------- 패밀리사이트 팝업 ---------- */
      function initFamily(familySiteData) {
        var modal = document.getElementById('familySiteModal');
        if (!modal) return;
        var openButtons = pack.querySelectorAll('.family-site-open');
        var closeButtons = modal.querySelectorAll('[data-close-family-site]');
        var eyebrowEl = document.getElementById('familySiteEyebrow');
        var titleEl = document.getElementById('familySiteModalTitle');
        var descEl = document.getElementById('familySiteDesc');
        var metaEl = document.getElementById('familySiteMeta');
        var toolbarTitleEl = document.getElementById('familySiteToolbarTitle');
        var toolbarDescEl = document.getElementById('familySiteToolbarDesc');
        var gridEl = document.getElementById('familySiteGrid');
        var noteEl = document.getElementById('familySiteNote');
        var lastFocusedElement = null;
        var scrollLockY = 0;
        var keys = Object.keys(familySiteData);

        function createMetaHTML(items) {
          return (items || []).map(function (item) {
            return '<div class="family-site-meta-item"><span>●</span><span>' + esc(item) + '</span></div>';
          }).join('');
        }

        function createCardHTML(site) {
          var soon = !site.href || site.href === '#';
          var arrow = site.external ? '↗' : '→';
          var inner =
            '<div class="family-site-card-top">' +
              '<span class="family-site-badge">' + esc(site.badge || '패밀리 사이트') + '</span>' +
              '<span class="family-site-arrow">' + arrow + '</span>' +
            '</div>' +
            '<h4>' + esc(site.title) + '</h4>' +
            '<p>' + esc(site.desc) + '</p>' +
            '<span class="family-site-url">' + esc(site.urlText) + '</span>';
          if (soon) return '<div class="family-site-card is-soon" aria-disabled="true">' + inner + '</div>';
          var target = site.external ? ' target="_blank" rel="noopener noreferrer"' : '';
          return '<a href="' + esc(site.href) + '" class="family-site-card"' + target + '>' + inner + '</a>';
        }

        function renderFamilySiteContent(key) {
          var data = familySiteData[key] || familySiteData[keys[0]];
          if (!data) return;
          if (eyebrowEl) eyebrowEl.textContent = data.eyebrow || '';
          if (titleEl) titleEl.textContent = data.title || '';
          if (descEl) descEl.textContent = data.desc || '';
          if (toolbarTitleEl) toolbarTitleEl.textContent = data.toolbarTitle || '';
          if (toolbarDescEl) toolbarDescEl.textContent = data.toolbarDesc || '';
          if (noteEl) noteEl.textContent = data.note || '';
          if (metaEl) metaEl.innerHTML = createMetaHTML(data.meta);
          if (gridEl) gridEl.innerHTML = (data.sites || []).map(createCardHTML).join('');
        }

        function openFamilySiteModal(key) {
          renderFamilySiteContent(key);
          lastFocusedElement = document.activeElement;
          scrollLockY = window.scrollY || window.pageYOffset || 0;
          document.body.style.position = 'fixed';
          document.body.style.top = '-' + scrollLockY + 'px';
          document.body.style.left = '0';
          document.body.style.right = '0';
          document.body.style.width = '100%';
          modal.classList.add('is-open');
          modal.setAttribute('aria-hidden', 'false');
          document.body.classList.add('family-site-modal-open');
          requestAnimationFrame(function () {
            var scrollArea = modal.querySelector('.family-site-main');
            if (scrollArea) scrollArea.scrollTop = 0;
          });
        }

        function closeFamilySiteModal() {
          modal.classList.remove('is-open');
          modal.setAttribute('aria-hidden', 'true');
          document.body.classList.remove('family-site-modal-open');
          document.body.style.position = '';
          document.body.style.top = '';
          document.body.style.left = '';
          document.body.style.right = '';
          document.body.style.width = '';
          window.scrollTo(0, scrollLockY);
          if (lastFocusedElement) lastFocusedElement.focus();
        }

        openButtons.forEach(function (button) {
          button.addEventListener('click', function (e) {
            e.preventDefault();
            openFamilySiteModal(button.getAttribute('data-family-key'));
          });
        });
        closeButtons.forEach(function (button) { button.addEventListener('click', closeFamilySiteModal); });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && modal.classList.contains('is-open')) closeFamilySiteModal();
        });
      }
    })();
  </script>
</section>

  <script>
    (function () {
      var root = document.getElementById('partner-logo-slider-section');
      if (!root || root.__htuInit) return;
      root.__htuInit = true;

      function htuCms() {
        if (window.__HTU_CMS_DATA__) return Promise.resolve(window.__HTU_CMS_DATA__);
        if (!window.__htuCmsP) {
          window.__htuCmsP = (window.HTU_I18N ? window.HTU_I18N.ready : Promise.resolve()).then(function () { return fetch(String(window.HTU_CMS_ENDPOINT || '').replace(/\/+$/, '') + (window.HTU_I18N ? window.HTU_I18N.q('/api/public/content') : '/api/public/content'), { credentials: 'omit' }); })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        }
        return window.__htuCmsP;
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      var ICON = {
        popup: '<svg class="pls-ind-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 6.5v11M6.5 12h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
        link: '<svg class="pls-ind-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 16 16 8M9.5 8H16v6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      };

      htuCms().then(function (data) {
        data = data || {};
        var st = (data.settings && data.settings.partners) || {};
        var p = data.partners || {};
        render(st, p.rolling || [], p.fixed || []);
        initModal(p.fixed || []);
      });

      function logoCard(item, extra) {
        return '<img class="pls-logo" src="' + esc(item.logo_url) + '" alt="' + esc(item.alt || item.name || '') + '" loading="lazy" decoding="async">' + (extra || '');
      }

      function render(st, rolling, fixed) {
        var title = root.querySelector('[data-cms="title"]');
        if (title) title.innerHTML = st.title_html || '';

        /* 롤링: 그룹 A + 복제 그룹 B → translateX(-50%) 무한 루프가 끊김 없이 이어짐 */
        var track = root.querySelector('.pls-track');
        if (!rolling.length) {
          root.querySelector('.pls-rolling').setAttribute('data-empty', '');
        } else {
          var seq = rolling.slice();
          while (seq.length < 8) seq = seq.concat(rolling);
          var groupHtml = seq.map(function (it) { return '<div class="pls-card">' + logoCard(it) + '</div>'; }).join('');
          track.innerHTML = '<div class="pls-group">' + groupHtml + '</div><div class="pls-group">' + groupHtml + '</div>';
          var speed = Number(st.rolling_speed) || 40;
          track.style.animationDuration = Math.max(10, speed * (seq.length / 14)) + 's';
        }

        /* 고정 그리드 */
        var popupLabel = st.popup_label || '자세히 보기';
        var linkLabel = st.link_label || '바로가기';
        var grid = root.querySelector('.pls-fixed-grid');
        grid.innerHTML = fixed.map(function (it, i) {
          var action = it.action || 'popup';
          if (action === 'link' && !it.homepage_url) action = 'none';
          if (action === 'link') {
            return '<a class="pls-card is-fixed" href="' + esc(it.homepage_url) + '" target="_blank" rel="noopener noreferrer" aria-label="' + esc((it.name || '') + ' 홈페이지로 이동') + '">' +
              logoCard(it, '<span class="pls-ind" data-kind="link"><span class="pls-ind-label">' + esc(linkLabel) + '</span>' + ICON.link + '</span>') + '</a>';
          }
          if (action === 'popup') {
            return '<div class="pls-card is-fixed" role="button" tabindex="0" data-idx="' + i + '" aria-label="' + esc((it.name || '') + ' 소개 팝업 열기') + '">' +
              logoCard(it, '<span class="pls-ind" data-kind="popup"><span class="pls-ind-label">' + esc(popupLabel) + '</span>' + ICON.popup + '</span>') + '</div>';
          }
          return '<div class="pls-card is-fixed is-static">' + logoCard(it) + '</div>';
        }).join('');
      }

      function initModal(fixed) {
        var modal = root.querySelector('#plsSponsorModal');
        var panel = modal ? modal.querySelector('.pls-panel') : null;
        if (!modal || !panel) return;

        var heroImg = modal.querySelector('#plsHeroImg');
        var brandName = modal.querySelector('#plsBrandName');
        var brandSub = modal.querySelector('#plsBrandSub');
        var headline = modal.querySelector('#plsHeadline');
        var desc = modal.querySelector('#plsDescription');
        var homepageBtn = modal.querySelector('#plsHomepageBtn');
        var homeWrap = modal.querySelector('.pls-home');
        var modalBody = modal.querySelector('#plsModalBody');
        var lastFocus = null;

        function lockScroll() {
          var y = window.pageYOffset || document.documentElement.scrollTop || 0;
          document.body.dataset.plsScrollY = String(y);
          document.body.style.position = 'fixed';
          document.body.style.top = '-' + y + 'px';
          document.body.style.left = '0';
          document.body.style.right = '0';
          document.body.style.width = '100%';
          document.body.style.overflow = 'hidden';
          document.documentElement.style.overflow = 'hidden';
        }
        function unlockScroll() {
          var y = parseInt(document.body.dataset.plsScrollY || '0', 10) || 0;
          document.body.style.position = '';
          document.body.style.top = '';
          document.body.style.left = '';
          document.body.style.right = '';
          document.body.style.width = '';
          document.body.style.overflow = '';
          document.documentElement.style.overflow = '';
          delete document.body.dataset.plsScrollY;
          window.scrollTo(0, y);
        }
        function resetModalScroll() {
          modal.scrollTop = 0; panel.scrollTop = 0;
          if (modalBody) modalBody.scrollTop = 0;
        }
        function forcePanelPaint() {
          panel.style.display = 'flex';
          panel.style.opacity = '1';
          panel.style.transform = 'translateY(0) scale(1)';
          panel.getBoundingClientRect();
        }

        function openModal(item) {
          lastFocus = document.activeElement;
          var name = item.name || 'Partner';
          brandName.textContent = name;
          brandSub.textContent = item.sub || '';
          headline.textContent = item.headline || '파트너 소개';
          desc.textContent = item.description || '';

          if (item.hero_url) {
            heroImg.style.display = '';
            heroImg.src = item.hero_url;
            heroImg.alt = name + ' 소개 이미지';
          } else {
            heroImg.style.display = 'none';
            heroImg.src = '';
            heroImg.alt = '';
          }

          if (item.homepage_url) {
            homeWrap.style.display = '';
            homepageBtn.href = item.homepage_url;
            homepageBtn.textContent = item.button_label || '공식 홈페이지 바로가기';
            homepageBtn.setAttribute('aria-label', name + ' 공식 홈페이지로 이동');
          } else {
            homeWrap.style.display = 'none';
          }

          modal.classList.add('is-open');
          modal.setAttribute('aria-hidden', 'false');
          lockScroll();
          resetModalScroll();
          forcePanelPaint();
          var closeBtn = modal.querySelector('[data-pls-close]');
          if (closeBtn) requestAnimationFrame(function () { closeBtn.focus({ preventScroll: true }); });
        }

        function closeModal() {
          modal.classList.remove('is-open');
          modal.setAttribute('aria-hidden', 'true');
          unlockScroll();
          if (lastFocus && typeof lastFocus.focus === 'function') {
            requestAnimationFrame(function () { lastFocus.focus({ preventScroll: true }); });
          }
        }

        modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
        modal.querySelectorAll('[data-pls-close]').forEach(function (btn) { btn.addEventListener('click', closeModal); });
        window.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && modal.classList.contains('is-open')) { e.preventDefault(); closeModal(); }
        });

        root.querySelectorAll('.pls-fixed-grid .pls-card[data-idx]').forEach(function (card) {
          var item = fixed[+card.getAttribute('data-idx')];
          card.addEventListener('click', function () { openModal(item); });
          card.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(item); }
          });
        });

        window.addEventListener('resize', function () {
          if (modal.classList.contains('is-open')) { resetModalScroll(); forcePanelPaint(); }
        });
      }
    })();
  </script>
</section>

        <button type="button" class="yvs-m-close" aria-label="닫기">&times;</button>
        <div class="yvs-m-cover"><img alt=""></div>
        <div class="yvs-m-body">
            <div class="yvs-m-eyebrow">Publication</div>
            <h3 class="yvs-m-title"></h3>
            <p class="yvs-m-desc"></p>
            <a class="yvs-m-btn" href="#" target="_blank" rel="noopener noreferrer"></a>
        </div>
    </div>

<script>
(function(){
    var section = document.querySelector("#youtubeVideoSection");
    if(!section || section.__htuInit) return;
    section.__htuInit = true;

    function htuCms(){
        if(window.__HTU_CMS_DATA__) return Promise.resolve(window.__HTU_CMS_DATA__);
        if(!window.__htuCmsP){
            window.__htuCmsP = (window.HTU_I18N ? window.HTU_I18N.ready : Promise.resolve()).then(function () { return fetch(String(window.HTU_CMS_ENDPOINT || '').replace(/\/+$/, '') + (window.HTU_I18N ? window.HTU_I18N.q('/api/public/content') : '/api/public/content'), { credentials: 'omit' }); })
                .then(function(r){ return r.ok ? r.json() : null; })
                .catch(function(){ return null; });
        }
        return window.__htuCmsP;
    }
    function esc(s){
        return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
            return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
        });
    }
    var ICON = {
        popup: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
        link: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7.5 16.5 16.5 7.5M9 7.5h7.5V15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };

    htuCms().then(function(data){
        data = data || {};
        var st = (data.settings && data.settings.publications) || {};
        var items = data.publications || [];
        if(!items.length){ section.style.display = 'none'; return; }
        render(st, items);
        initModal(items);
        initFade();
    });

    function render(st, items){
        var title = section.querySelector('[data-cms="title"]');
        if(title) title.textContent = st.title || '정기 출간물';
        var popupLabel = st.popup_label || '자세히 보기';
        var linkLabel = st.link_label || '바로가기';

        section.querySelector('.yvs-grid').innerHTML = items.map(function(it, i){
            var action = it.action || 'link';
            if(action === 'link' && !it.link_url) action = 'none';
            var label = action === 'popup' ? popupLabel : linkLabel;
            var ind = action === 'none' ? '' :
                '<span class="yvs-ind" data-kind="' + action + '" aria-hidden="true">' + ICON[action] + '</span>';
            var cta = action === 'none' ? '' :
                '<span class="yvs-cta" data-kind="' + action + '">' + esc(label) + ICON[action] + '</span>';
            var inner =
                '<div class="yvs-image" data-border="' + esc(it.image_border || 'none') + '">' +
                    '<img src="' + esc(it.cover_url) + '" alt="' + esc(it.caption) + '" loading="lazy" decoding="async">' + ind +
                '</div>' +
                '<div class="yvs-caption"><span>' + esc(it.caption) + '</span>' + cta + '</div>';

            var hit;
            if(action === 'link'){
                hit = '<a class="yvs-hit" href="' + esc(it.link_url) + '" target="_blank" rel="noopener noreferrer" aria-label="' + esc((it.caption || '') + ' ' + label) + '">' + inner + '</a>';
            }else if(action === 'popup'){
                hit = '<button type="button" class="yvs-hit" data-idx="' + i + '" aria-label="' + esc((it.caption || '') + ' ' + label) + '">' + inner + '</button>';
            }else{
                hit = '<div class="yvs-hit is-static">' + inner + '</div>';
            }
            return '<div class="yvs-card fadeItem">' + hit + '</div>';
        }).join('');
    }

    function initModal(items){
        var modal = section.querySelector('.yvs-modal');
        var img = modal.querySelector('.yvs-m-cover img');
        var t = modal.querySelector('.yvs-m-title');
        var d = modal.querySelector('.yvs-m-desc');
        var btn = modal.querySelector('.yvs-m-btn');
        var last = null;

        function open(it){
            last = document.activeElement;
            img.src = it.cover_url || ''; img.alt = it.caption || '';
            t.textContent = it.popup_title || it.caption || '';
            d.textContent = it.popup_desc || '';
            d.style.display = it.popup_desc ? '' : 'none';
            if(it.link_url){
                btn.style.display = ''; btn.href = it.link_url;
                btn.textContent = (it.button_label || '홈페이지 바로가기') + ' ↗';
            }else{ btn.style.display = 'none'; }
            modal.classList.add('is-open'); modal.setAttribute('aria-hidden','false');
            document.documentElement.style.overflow = 'hidden';
            modal.querySelector('.yvs-m-close').focus({ preventScroll:true });
        }
        function close(){
            modal.classList.remove('is-open'); modal.setAttribute('aria-hidden','true');
            document.documentElement.style.overflow = '';
            if(last && last.focus) last.focus({ preventScroll:true });
        }
        section.querySelectorAll('.yvs-hit[data-idx]').forEach(function(b){
            b.addEventListener('click', function(){ open(items[+b.getAttribute('data-idx')]); });
        });
        modal.querySelector('.yvs-m-close').addEventListener('click', close);
        modal.addEventListener('click', function(e){ if(e.target === modal) close(); });
        document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && modal.classList.contains('is-open')) close(); });
    }

    /* 등장 애니메이션 (원본 로직) */
    function initFade(){
        var items = section.querySelectorAll(".fadeItem");
        var isActive = false;
        var rafId = null;

        function setActive(nextState){
            if(isActive === nextState) return;
            isActive = nextState;
            if(rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(function(){
                items.forEach(function(el){ el.classList.toggle("active", isActive); });
            });
        }
        function check(){
            var rect = section.getBoundingClientRect();
            var vh = window.innerHeight || document.documentElement.clientHeight;
            setActive(rect.top < vh * 0.88 && rect.bottom > vh * 0.12);
        }
        if('IntersectionObserver' in window){
            new IntersectionObserver(function(entries){
                entries.forEach(function(entry){
                    var vh = window.innerHeight || document.documentElement.clientHeight;
                    var rect = entry.boundingClientRect;
                    setActive(entry.isIntersecting && rect.top < vh * 0.88 && rect.bottom > vh * 0.12);
                });
            }, { threshold:[0, 0.08, 0.18, 0.28] }).observe(section);
        }else{ setActive(true); }
        window.addEventListener("pageshow", check);
        check();
    }
})();
</script>

    <h2 class="bsg-title" data-cms="title">전문가 연재</h2>
    <div class="bsg-nav">
      <button class="bsg-nav-btn bsg-prev" type="button" aria-label="이전">‹</button>
      <button class="bsg-nav-btn bsg-next" type="button" aria-label="다음">›</button>
    </div>
  </div>

  <div class="bsg-viewport">
    <div class="bsg-track" aria-roledescription="carousel"></div>
    <div class="bsg-dots"></div>
  </div>

  <div class="bsg-overlay" id="bsgOv">
    <div class="bsg-m-wrap">
      <div class="bsg-m-card" id="bsgMC"></div>
      <div class="bsg-m-info">
        <div class="bsg-m-title" id="bsgMT"></div>
        <div class="bsg-m-sub" id="bsgMS"></div>
      </div>
      <div class="bsg-m-btns">
        <a class="bsg-m-btn bsg-pdf-btn" id="bsgPdfBtn" href="#" target="_blank" rel="noopener">PDF 파일 보기</a>
        <button class="bsg-m-btn" id="bsgMBtn" type="button">닫기</button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      var gallery = document.getElementById('bookshelf-gallery');
      if(!gallery || gallery.__htuInit) return;
      gallery.__htuInit = true;

      function htuCms(){
        if(window.__HTU_CMS_DATA__) return Promise.resolve(window.__HTU_CMS_DATA__);
        if(!window.__htuCmsP){
          window.__htuCmsP = (window.HTU_I18N ? window.HTU_I18N.ready : Promise.resolve()).then(function () { return fetch(String(window.HTU_CMS_ENDPOINT || '').replace(/\/+$/, '') + (window.HTU_I18N ? window.HTU_I18N.q('/api/public/content') : '/api/public/content'), { credentials: 'omit' }); })
            .then(function(r){ return r.ok ? r.json() : null; })
            .catch(function(){ return null; });
        }
        return window.__htuCmsP;
      }

      htuCms().then(function(data){
        data = data || {};
        var st = (data.settings && data.settings.columns) || {};
        var list = data.columns || [];
        if(!list.length){ gallery.style.display = 'none'; return; }
        init(st, list);
      });

      function init(st, list){
        var COLS = 3, ROWS = 2, PER = COLS * ROWS;

        var track    = gallery.querySelector('.bsg-track');
        var dotsWrap = gallery.querySelector('.bsg-dots');
        var prevBtn  = gallery.querySelector('.bsg-prev');
        var nextBtn  = gallery.querySelector('.bsg-next');

        var overlay    = document.getElementById('bsgOv');
        var modalCard  = document.getElementById('bsgMC');
        var modalTitle = document.getElementById('bsgMT');
        var modalSub   = document.getElementById('bsgMS');
        var modalBtn   = document.getElementById('bsgMBtn');
        var pdfBtn     = document.getElementById('bsgPdfBtn');

        gallery.querySelector('[data-cms="title"]').textContent = st.title || '전문가 연재';
        pdfBtn.textContent = st.pdf_button || 'PDF 파일 보기';

        function el(cls){ var d = document.createElement('div'); d.className = cls; return d; }

        /* ── 데이터 → 카드 엘리먼트 ── */
        var cards = list.map(function(it){
          var card = el('bsg-card');
          card.setAttribute('data-t', it.title || it.card_title || '');
          card.setAttribute('data-s', it.subtitle || '');
          card.setAttribute('data-img-src', it.image_url || '');
          card.setAttribute('data-pdf-url', it.pdf_url || '');
          var cover = el('bsg-cover');
          var content = el('bsg-cover-content');
          var t = el('bsg-cover-title'); t.textContent = it.card_title || it.title || '';
          var s = el('bsg-cover-sub'); s.textContent = st.card_button || '연재 보기';
          content.appendChild(t); content.appendChild(s);
          cover.appendChild(content); card.appendChild(cover);
          return card;
        });

        var slideCount = Math.max(1, Math.ceil(cards.length / PER));
        var current = 0;
        var dots = [];

        /* ── 슬라이드 빌드: 항상 3x2 슬롯 유지 ── */
        for(var s = 0; s < slideCount; s++){
          var slide = el('bsg-slide');
          slide.setAttribute('role', 'group');
          slide.setAttribute('aria-label', (s + 1) + ' / ' + slideCount);

          for(var r = 0; r < ROWS; r++){
            var tier = el('bsg-tier');
            var grid = el('bsg-grid');
            for(var c = 0; c < COLS; c++){
              var card = cards[s * PER + r * COLS + c];
              if(card){
                card.setAttribute('tabindex', '0');
                card.setAttribute('role', 'button');
                grid.appendChild(card);
              }else{
                var empty = el('bsg-slot-empty');
                empty.setAttribute('aria-hidden', 'true');
                grid.appendChild(empty);
              }
            }
            var shelf = el('bsg-shelf');
            shelf.innerHTML = '<div class="bsg-shelf-top"></div><div class="bsg-shelf-face"></div>';
            tier.appendChild(grid);
            tier.appendChild(shelf);
            slide.appendChild(tier);
          }
          track.appendChild(slide);

          var dot = document.createElement('button');
          dot.type = 'button';
          dot.className = 'bsg-dot';
          dot.setAttribute('aria-label', (s + 1) + '번 슬라이드');
          (function(i){ dot.addEventListener('click', function(){ goTo(i); }); })(s);
          dotsWrap.appendChild(dot);
          dots.push(dot);
        }

        gallery.classList.toggle('is-multi', slideCount > 1);

        /* ── 이미지 ── */
        cards.forEach(function(cardEl, idx){
          var src = cardEl.getAttribute('data-img-src');
          var cover = cardEl.querySelector('.bsg-cover');
          if(!src || !cover){ cardEl.classList.add('bsg-loaded'); return; }

          var img = document.createElement('img');
          img.className = 'bsg-card-img';
          img.alt = cardEl.getAttribute('data-t') || '';
          img.draggable = false;
          img.decoding = 'async';
          img.loading = idx < PER ? 'eager' : 'lazy';
          if(idx < PER){ try{ img.fetchPriority = 'high'; }catch(e){} }

          img.onload = function(){ img.classList.add('is-loaded'); cardEl.classList.add('bsg-loaded'); };
          img.onerror = function(){ img.style.display = 'none'; cardEl.classList.add('bsg-loaded'); };
          img.src = src;

          var ovl = el('bsg-img-overlay');
          cover.insertBefore(img, cover.firstChild);
          cover.insertBefore(ovl, img.nextSibling);

          if(img.complete && img.naturalWidth > 0){
            img.classList.add('is-loaded');
            cardEl.classList.add('bsg-loaded');
          }
        });

        /* ── 슬라이드 이동 ── */
        function slideW(){ return track.clientWidth || 1; }

        function updateUI(){
          prevBtn.disabled = current <= 0;
          nextBtn.disabled = current >= slideCount - 1;
          dots.forEach(function(d, i){ d.classList.toggle('is-active', i === current); });
        }

        function goTo(i, instant){
          current = Math.max(0, Math.min(slideCount - 1, i));
          track.scrollTo({ left: current * slideW(), behavior: instant ? 'auto' : 'smooth' });
          updateUI();
          if(autoReady && !instant) restartAuto();
        }

        prevBtn.addEventListener('click', function(){ goTo(current - 1); });
        nextBtn.addEventListener('click', function(){ goTo(current + 1); });

        var scrollRaf = 0;
        track.addEventListener('scroll', function(){
          if(drag.active) return;
          cancelAnimationFrame(scrollRaf);
          scrollRaf = requestAnimationFrame(function(){
            var i = Math.round(track.scrollLeft / slideW());
            if(i !== current){ current = i; updateUI(); if(autoReady) restartAuto(); }
          });
        }, { passive:true });

        var resizeRaf = 0;
        function keepPosition(){
          cancelAnimationFrame(resizeRaf);
          resizeRaf = requestAnimationFrame(function(){ goTo(current, true); });
        }
        if('ResizeObserver' in window){ new ResizeObserver(keepPosition).observe(track); }
        else{ window.addEventListener('resize', keepPosition); }

        /* ── 마우스 드래그 ── */
        var drag = { down:false, active:false, moved:false, x:0, left:0 };
        var dragEndTimer = 0;

        track.addEventListener('pointerdown', function(e){
          if(e.pointerType !== 'mouse' || e.button !== 0 || slideCount < 2) return;
          drag.down = true; drag.moved = false;
          drag.x = e.clientX; drag.left = track.scrollLeft;
        });

        track.addEventListener('pointermove', function(e){
          if(!drag.down) return;
          var dx = e.clientX - drag.x;
          if(!drag.moved && Math.abs(dx) > 6){
            drag.moved = true; drag.active = true;
            clearTimeout(dragEndTimer);
            track.classList.add('is-dragging');
            try{ track.setPointerCapture(e.pointerId); }catch(err){}
          }
          if(drag.moved) track.scrollLeft = drag.left - dx;
        });

        function endDrag(e){
          if(!drag.down) return;
          drag.down = false;
          if(!drag.moved) return;
          var dx = (e && typeof e.clientX === 'number') ? e.clientX - drag.x : 0;
          var base = Math.round(drag.left / slideW());
          var threshold = slideW() * 0.12;
          var target = dx < -threshold ? base + 1 : dx > threshold ? base - 1 : base;
          goTo(target);
          dragEndTimer = setTimeout(function(){
            drag.active = false;
            track.classList.remove('is-dragging');
            if(autoReady) restartAuto();
          }, 450);
        }
        track.addEventListener('pointerup', endDrag);
        track.addEventListener('pointercancel', endDrag);

        /* 가로 휠 차단, 세로 휠은 페이지로 */
        track.addEventListener('wheel', function(e){
          var horizontal = e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY);
          if(!horizontal) return;
          e.preventDefault();
          if(e.shiftKey && Math.abs(e.deltaY) > Math.abs(e.deltaX)){
            window.scrollBy({ top: e.deltaY, behavior: 'auto' });
          }
        }, { passive:false });

        /* ── 카드 클릭 / 키보드 ── */
        track.addEventListener('click', function(e){
          if(drag.moved){ drag.moved = false; return; }
          var card = e.target.closest('.bsg-card');
          if(card) openModal(card);
        });
        track.addEventListener('keydown', function(e){
          var card = e.target.closest('.bsg-card');
          if(card && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); openModal(card); }
        });
        track.addEventListener('focusin', function(e){
          var slide = e.target.closest('.bsg-slide');
          if(!slide) return;
          var i = Array.prototype.indexOf.call(track.children, slide);
          if(i !== current) goTo(i);
        });

        /* ── Modal ── */
        function setModalSizeByImage(src, callback){
          var tempImg = new Image();
          tempImg.onload = function(){
            var ratio = tempImg.naturalWidth / tempImg.naturalHeight;
            var maxW = Math.min(window.innerWidth * .86, 620);
            var maxH = window.innerHeight * .64;
            if(window.innerWidth <= 768){ maxW = window.innerWidth * .86; maxH = window.innerHeight * .58; }
            var finalW = maxW;
            var finalH = finalW / ratio;
            if(finalH > maxH){ finalH = maxH; finalW = finalH * ratio; }
            modalCard.style.width = finalW + 'px';
            modalCard.style.height = finalH + 'px';
            callback();
          };
          tempImg.onerror = function(){
            modalCard.style.width = 'min(86vw,420px)';
            modalCard.style.height = '58dvh';
            callback();
          };
          tempImg.src = src;
        }

        function openModal(cardEl){
          var src = cardEl.getAttribute('data-img-src') || '';
          var pdfUrl = cardEl.getAttribute('data-pdf-url') || '';

          modalCard.innerHTML = '';
          var cover = el('bsg-cover');
          var img = document.createElement('img');
          img.className = 'bsg-card-img is-loaded';
          img.src = src;
          img.alt = cardEl.getAttribute('data-t') || '';
          img.draggable = false;
          cover.appendChild(img);
          modalCard.appendChild(cover);

          modalTitle.textContent = cardEl.getAttribute('data-t') || '';
          modalSub.textContent = cardEl.getAttribute('data-s') || '';

          if(pdfUrl.trim()){ pdfBtn.href = pdfUrl; pdfBtn.style.display = 'inline-flex'; }
          else{ pdfBtn.style.display = 'none'; }

          pause.modal = true;
          stopAuto();

          setModalSizeByImage(src, function(){
            overlay.style.display = 'flex';
            requestAnimationFrame(function(){ overlay.classList.add('open'); });
            document.documentElement.style.overflow = 'hidden';
            document.body.style.overflow = 'hidden';
          });
        }

        function closeModal(){
          overlay.classList.remove('open');
          overlay.style.opacity = '0';
          setTimeout(function(){
            overlay.style.display = 'none';
            overlay.style.opacity = '';
            modalCard.innerHTML = '';
          }, 300);
          document.documentElement.style.overflow = '';
          document.body.style.overflow = '';
          pause.modal = false;
          restartAuto();
        }

        overlay.addEventListener('click', function(e){ if(!e.target.closest('.bsg-m-wrap')) closeModal(); });
        modalBtn.addEventListener('click', closeModal);
        document.addEventListener('keydown', function(e){
          if(e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
        });

        /* ── 자동 슬라이드 ── */
        var AUTO_DELAY = Number(st.auto_delay);
        if(!(AUTO_DELAY >= 0)) AUTO_DELAY = 5000;
        var autoTimer = 0;
        var autoReady = false;
        var pause = { hover:false, touch:false, focus:false, modal:false, offscreen:false, hidden:false };

        function isPaused(){
          if(slideCount < 2 || drag.active) return true;
          for(var k in pause){ if(pause[k]) return true; }
          return false;
        }
        function stopAuto(){ clearTimeout(autoTimer); }
        function restartAuto(){
          stopAuto();
          if(!autoReady || isPaused()) return;
          autoTimer = setTimeout(function(){
            if(isPaused()) return;
            goTo(current >= slideCount - 1 ? 0 : current + 1);
          }, AUTO_DELAY);
        }
        function setPause(key, val){ pause[key] = val; val ? stopAuto() : restartAuto(); }

        gallery.addEventListener('pointerenter', function(e){ if(e.pointerType === 'mouse') setPause('hover', true); });
        gallery.addEventListener('pointerleave', function(e){ if(e.pointerType === 'mouse') setPause('hover', false); });
        track.addEventListener('touchstart', function(){ setPause('touch', true); }, { passive:true });
        track.addEventListener('touchend', function(){ setPause('touch', false); }, { passive:true });
        track.addEventListener('touchcancel', function(){ setPause('touch', false); }, { passive:true });
        gallery.addEventListener('focusin', function(e){ if(e.target.closest('.bsg-card')) setPause('focus', true); });
        gallery.addEventListener('focusout', function(e){
          if(!gallery.contains(e.relatedTarget) || !e.relatedTarget.closest('.bsg-card')) setPause('focus', false);
        });
        document.addEventListener('visibilitychange', function(){ setPause('hidden', document.hidden); });
        if('IntersectionObserver' in window){
          new IntersectionObserver(function(entries){
            setPause('offscreen', !entries[0].isIntersecting);
          }, { threshold:0.25 }).observe(gallery);
        }
        if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ AUTO_DELAY = 0; }

        updateUI();
        if(AUTO_DELAY > 0){ autoReady = true; restartAuto(); }
      }
    })();
  </script>
</section>


<section id="yt-autoplay-reel" class="yt-autoplay-reel" aria-label="영상 소개">
  <div class="yar-inner yar-anim">
    <div class="yar-stage">
      <div class="yar-ratio">
        <div id="yar-player"></div>
      </div>

      <button class="yar-sound" type="button" aria-label="소리 켜기" data-muted="true">
        <span class="yar-sound-ico" aria-hidden="true">
          <svg class="yar-ico is-muted" viewBox="0 0 24 24" fill="none">
            <path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/>
            <path d="M16 9l5 5M21 9l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg class="yar-ico is-unmuted" viewBox="0 0 24 24" fill="none">
            <path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/>
            <path d="M16.5 8.5a5 5 0 0 1 0 7M18.8 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="yar-sound-txt">소리 켜기</span>
      </button>

      <div class="yar-dots" aria-hidden="true"></div>
    </div>
  </div>

  <style>    /* ===== 스코프 루트 ===== */
    #yt-autoplay-reel{
      container-type: inline-size;
      container-name: yarwrap;
      display: block;
      position:relative;
      width: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background: #e7e5e1;
      line-height: 0;            /* 비디오 하단 여백 제거 */
      font-family: "Noto Sans KR", "Pretendard", system-ui, -apple-system, sans-serif;
    }
    #yt-autoplay-reel *{ box-sizing: border-box; }

    #yt-autoplay-reel .yar-inner{
      width: 100%;
      max-width: 1200px;
      margin:0 auto;
      position: relative;
    }

    /* ===== 등장 애니메이션 (영상 재생과 독립) ===== */
    #yt-autoplay-reel .yar-anim{
      opacity: 0;
      transform: translateY(7cqw);
      will-change: opacity, transform;
    }
    #yt-autoplay-reel .yar-anim.is-in{
      animation: yar-fadeInUp 1s cubic-bezier(.16,.84,.34,1) forwards;
    }
    @keyframes yar-fadeInUp{
      from{ opacity: 0; transform: translateY(7cqw); }
      to{ opacity: 1; transform: translateY(0); }
    }

    /* ===== 무대 ===== */
    #yt-autoplay-reel .yar-stage{
      position: relative;       /* 내부 absolute의 기준 → 외부 레이아웃 영향 없음 */
      width: 100%;
      overflow: hidden;
      background: #000;
    }

    /* 16:9 반응형 비율 박스 */
    #yt-autoplay-reel .yar-ratio{
      position: relative;
      width: 100%;
      padding-top: 56.25%;      /* 16:9 = 9/16 */
      background: #000;
    }
    #yt-autoplay-reel .yar-ratio > iframe,
    #yt-autoplay-reel .yar-ratio > #yar-player{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* 호버 시 미세하게 떠오르는 그라데이션 (버튼 가독성 확보) */
    #yt-autoplay-reel .yar-stage::after{
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 28cqw;
      max-height: 160px;
      background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0));
      opacity: 0;
      transition: opacity .35s ease;
      pointer-events: none;
      z-index: 2;
    }
    #yt-autoplay-reel .yar-stage:hover::after{ opacity: 1; }

    /* ===== 소리 켜기 버튼 ===== */
    #yt-autoplay-reel .yar-sound{
      position: absolute;
      right: 3cqw;
      bottom: 3cqw;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 1.4cqw;
      padding: 1.6cqw 2.6cqw;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      background: rgba(15,15,18,.62);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      cursor: pointer;
      line-height: 1;
      font-family: inherit;
      font-weight: 700;
      letter-spacing: -0.01em;
      opacity: 0;
      transform: translateY(1.4cqw);
      transition: opacity .35s ease, transform .35s ease, background .2s ease, border-color .2s ease;
    }
    #yt-autoplay-reel .yar-stage:hover .yar-sound{
      opacity: 1;
      transform: translateY(0);
    }
    #yt-autoplay-reel .yar-sound:hover{
      background: rgba(15,15,18,.85);
      border-color: rgba(255,255,255,.7);
    }
    #yt-autoplay-reel .yar-sound:focus-visible{
      outline: 2px solid #fff;
      outline-offset: 2px;
      opacity: 1;
      transform: translateY(0);
    }

    #yt-autoplay-reel .yar-sound-ico{
      display: inline-flex;
      width: 4.4cqw;
      height: 4.4cqw;
      min-width: 16px; min-height: 16px;
      max-width: 26px; max-height: 26px;
    }
    #yt-autoplay-reel .yar-ico{ width: 100%; height: 100%; }
    #yt-autoplay-reel .yar-ico.is-unmuted{ display: none; }
    /* 음소거 해제 상태 */
    #yt-autoplay-reel .yar-sound[data-muted="false"] .yar-ico.is-muted{ display: none; }
    #yt-autoplay-reel .yar-sound[data-muted="false"] .yar-ico.is-unmuted{ display: block; }

    #yt-autoplay-reel .yar-sound-txt{
      font-size: 3.2cqw;
      white-space: nowrap;
    }
    /* 데스크톱 상한 (큰 화면에서 버튼이 과대해지는 것 방지) */
    @container yarwrap (min-width: 760px){
      #yt-autoplay-reel .yar-sound{
        right: 22px; bottom: 22px;
        gap: 9px; padding: 11px 18px;
      }
      #yt-autoplay-reel .yar-sound-txt{ font-size: 15px; }
    }

    /* ===== 진행 점 인디케이터 ===== */
    #yt-autoplay-reel .yar-dots{
      position: absolute;
      left: 3cqw;
      bottom: 3.6cqw;
      z-index: 3;
      display: flex;
      gap: 1.4cqw;
      opacity: 0;
      transition: opacity .35s ease;
      pointer-events: none;
    }
    #yt-autoplay-reel .yar-stage:hover .yar-dots{ opacity: 1; }
    #yt-autoplay-reel .yar-dot{
      width: 1.8cqw; height: 1.8cqw;
      min-width: 7px; min-height: 7px;
      max-width: 10px; max-height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.4);
      transition: background .25s ease, transform .25s ease;
    }
    #yt-autoplay-reel .yar-dot.is-active{
      background: #fff;
      transform: scale(1.25);
    }
    @container yarwrap (min-width: 760px){
      #yt-autoplay-reel .yar-dots{ left: 22px; bottom: 24px; gap: 8px; }
    }

    /* ===== 터치 기기: 호버 불가 → 버튼 항상 노출 ===== */
    @media (hover: none){
      #yt-autoplay-reel .yar-sound{ opacity: 1; transform: none; }
      #yt-autoplay-reel .yar-stage::after{ opacity: 1; }
    }

    /* ===== 모션 최소화 선호 존중 ===== */
    @media (prefers-reduced-motion: reduce){
      #yt-autoplay-reel .yar-anim{ opacity: 1; transform: none; animation: none; }
      #yt-autoplay-reel .yar-sound,
      #yt-autoplay-reel .yar-stage::after,

  <script>
  (function(){
    "use strict";

    var section = document.getElementById("yt-autoplay-reel");
    if(!section || section.__htuInit) return;
    section.__htuInit = true;

    function htuCms(){
      if(window.__HTU_CMS_DATA__) return Promise.resolve(window.__HTU_CMS_DATA__);
      if(!window.__htuCmsP){
        window.__htuCmsP = (window.HTU_I18N ? window.HTU_I18N.ready : Promise.resolve()).then(function () { return fetch(String(window.HTU_CMS_ENDPOINT || '').replace(/\/+$/, '') + (window.HTU_I18N ? window.HTU_I18N.q('/api/public/content') : '/api/public/content'), { credentials: 'omit' }); })
          .then(function(r){ return r.ok ? r.json() : null; })
          .catch(function(){ return null; });
      }
      return window.__htuCmsP;
    }

    // 유튜브 URL/ID → videoId
    function extractId(input){
      if(!input) return null;
      input = String(input).trim();
      if(/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
      var m;
      m = input.match(/[?&]v=([a-zA-Z0-9_-]{11})/);    if(m) return m[1];
      m = input.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/); if(m) return m[1];
      m = input.match(/\/shorts\/([a-zA-Z0-9_-]{11})/);  if(m) return m[1];
      m = input.match(/\/embed\/([a-zA-Z0-9_-]{11})/);   if(m) return m[1];
      m = input.match(/\/live\/([a-zA-Z0-9_-]{11})/);    if(m) return m[1];
      return null;
    }

    function shuffle(arr){
      var a = arr.slice();
      for(var i = a.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    htuCms().then(function(data){
      data = data || {};
      var st = (data.settings && data.settings.reel) || {};
      var list = (data.reel || []).map(function(v){ return extractId(v.youtube_url); }).filter(Boolean);
      if(st.enabled === false || !list.length){ section.style.display = 'none'; return; }
      start(st, list);
    });

    function start(st, baseIds){
      var useShuffle = !!st.shuffle;
      var reshuffleEachLoop = st.reshuffle_each_loop !== false;
      var ids = useShuffle ? shuffle(baseIds) : baseIds.slice();

      var player = null;
      var current = 0;
      var userWantsSound = false;

      var soundBtn = section.querySelector(".yar-sound");
      var soundTxt = section.querySelector(".yar-sound-txt");
      var dotsWrap = section.querySelector(".yar-dots");

      var dotEls = [];
      if(dotsWrap){
        dotsWrap.innerHTML = '';
        for(var i = 0; i < ids.length; i++){
          var d = document.createElement("span");
          d.className = "yar-dot" + (i === 0 ? " is-active" : "");
          dotsWrap.appendChild(d);
          dotEls.push(d);
        }
      }
      function updateDots(){
        for(var i = 0; i < dotEls.length; i++) dotEls[i].classList.toggle("is-active", i === current);
      }

      /* 다음 영상 결정: 한 바퀴 돌면(랜덤 모드) 다시 섞되 방금 본 영상이 연속되지 않게 */
      function nextId(){
        current++;
        if(current >= ids.length){
          current = 0;
          if(useShuffle && reshuffleEachLoop && ids.length > 1){
            var lastPlayed = ids[ids.length - 1];
            var next = shuffle(baseIds);
            if(next[0] === lastPlayed){ var t = next[0]; next[0] = next[next.length - 1]; next[next.length - 1] = t; }
            ids = next;
          }
        }
        updateDots();
        return ids[current];
      }

      function loadYTApi(cb){
        if(window.YT && window.YT.Player){ cb(); return; }
        window.__yarApiQueue = window.__yarApiQueue || [];
        window.__yarApiQueue.push(cb);
        if(!window.__yarApiHooked){
          window.__yarApiHooked = true;
          var prev = window.onYouTubeIframeAPIReady;
          window.onYouTubeIframeAPIReady = function(){
            if(typeof prev === "function"){ try{ prev(); }catch(e){} }
            var q = window.__yarApiQueue || [];
            window.__yarApiQueue = [];
            for(var i = 0; i < q.length; i++){ try{ q[i](); }catch(e){} }
          };
        }
        if(!document.getElementById("__yar_yt_api")){
          var tag = document.createElement("script");
          tag.id = "__yar_yt_api";
          tag.src = "https://www.youtube.com/iframe_api";
          var first = document.getElementsByTagName("script")[0];
          if(first && first.parentNode) first.parentNode.insertBefore(tag, first);
          else document.head.appendChild(tag);
        }
      }

      function applySoundState(){
        if(!player) return;
        if(userWantsSound){ try{ player.unMute(); player.setVolume(100); }catch(e){} }
        else{ try{ player.mute(); }catch(e){} }
        if(soundBtn){
          soundBtn.setAttribute("data-muted", userWantsSound ? "false" : "true");
          soundBtn.setAttribute("aria-label", userWantsSound ? "음소거" : "소리 켜기");
        }
        if(soundTxt) soundTxt.textContent = userWantsSound ? "음소거" : "소리 켜기";
      }

      function buildPlayer(){
        player = new YT.Player("yar-player", {
          videoId: ids[0],
          playerVars: { autoplay:1, mute:1, controls:0, rel:0, playsinline:1, modestbranding:1, disablekb:1, fs:0, iv_load_policy:3 },
          events: {
            onReady: function(e){
              try{ e.target.mute(); }catch(err){}
              try{ e.target.playVideo(); }catch(err){}
              applySoundState();
            },
            onStateChange: function(e){
              if(e.data === YT.PlayerState.ENDED){
                try{ player.loadVideoById(nextId()); }catch(err){}
                setTimeout(applySoundState, 250);
              }
            },
            onError: function(){
              // 재생 불가(삭제/비공개) 영상은 건너뜀
              try{ player.loadVideoById(nextId()); }catch(err){}
            }
          }
        });
      }

      if(soundBtn){
        soundBtn.addEventListener("click", function(){
          userWantsSound = !userWantsSound;
          applySoundState();
        });
      }

      var animEl = section.querySelector(".yar-anim");
      if(animEl){
        if("IntersectionObserver" in window){
          var io = new IntersectionObserver(function(entries){
            entries.forEach(function(en){
              if(en.isIntersecting){ en.target.classList.add("is-in"); io.unobserve(en.target); }
            });
          }, { threshold: 0.18 });
          io.observe(animEl);
        }else{
          animEl.classList.add("is-in");
        }
      }

      // 속도: 유튜브 플레이어(약 1MB)는 이 섹션이 화면에 가까워질 때 불러옴
      (function(){
        var started = false;
        function go(){ if(started) return; started = true; loadYTApi(buildPlayer); }
        if("IntersectionObserver" in window){
          var lio = new IntersectionObserver(function(entries){
            if(entries.some(function(en){ return en.isIntersecting; })){ lio.disconnect(); go(); }
          }, { rootMargin: "800px 0px" });
          lio.observe(section);
        } else { setTimeout(go, 2500); }
      })();
    }
  })();
  </script>
</section>

        var btnNext = section.querySelector('#newsNext');
        var moreBtn = section.querySelector('#newsMoreBtn');
        var mobileMq = window.matchMedia('(max-width: 900px)');
        var showBadge = st.show_source_badge !== false;
        var interval = Number(st.auto_interval) || 4200;

        var currentPage = 0;
        var pageCount = 1;
        var autoTimer = null;
        var mobileVisibleCount = 5;
        var dragStartX = 0;
        var isDragging = false;
        var isAnimating = false;
        var desktopFixedTrackHeight = 0;

        function isMobile() { return mobileMq.matches; }
        function getPageSize() { return 6; }

        function buildSlide(item) {
          var node = tpl.content.cloneNode(true);
          var slide = node.querySelector('.slide');
          var linkEl = node.querySelector('.slide-link');
          var img = node.querySelector('img');
          var title = node.querySelector('.title');
          var excerpt = node.querySelector('.excerpt');
          var chip = node.querySelector('.src-chip');

          var href = item.link || '#';
          linkEl.href = href;
          var target = item.target || (/^https?:\/\//i.test(href) ? '_blank' : '_self');
          linkEl.target = target;
          linkEl.rel = target === '_blank' ? 'noopener noreferrer' : 'noopener';

          title.textContent = item.title || '';
          excerpt.textContent = item.excerpt || '';
          img.loading = 'lazy'; img.decoding = 'async';
          img.src = item.img || '';
          img.alt = item.title ? item.title : 'news thumbnail';

          if (showBadge && chip) {
            chip.setAttribute('data-type', item.type || 'external');
            chip.innerHTML = item.type === 'internal' ? 'HTU 소식' : item.type === 'event' ? '이벤트' : '외부 기사 ' + ARROW;
          }
          if (!item.img) {
            var thumb = node.querySelector('.thumb');
            if (thumb) thumb.style.display = 'none';
          }
          return slide;
        }

        function buildPage(pageIndex) {
          var pageSize = getPageSize();
          var start = pageIndex * pageSize;
          var page = document.createElement('div');
          page.className = 'page';
          items.slice(start, start + pageSize).forEach(function (item) { page.appendChild(buildSlide(item)); });
          return page;
        }

        function measureDesktopFixedHeight() {
          if (isMobile()) { desktopFixedTrackHeight = 0; track.style.height = ''; return; }
          var totalPages = Math.max(1, Math.ceil(items.length / getPageSize()));
          var probe = document.createElement('div');
          probe.style.position = 'absolute';
          probe.style.left = '0';
          probe.style.top = '0';
          probe.style.width = track.clientWidth ? track.clientWidth + 'px' : '100%';
          probe.style.visibility = 'hidden';
          probe.style.pointerEvents = 'none';
          probe.style.zIndex = '-1';
          section.appendChild(probe);
          var maxHeight = 0;
          for (var i = 0; i < totalPages; i++) {
            var page = buildPage(i);
            probe.appendChild(page);
            var h = page.offsetHeight;
            if (h > maxHeight) maxHeight = h;
            probe.removeChild(page);
          }
          probe.remove();
          desktopFixedTrackHeight = maxHeight;
          if (desktopFixedTrackHeight > 0) track.style.height = desktopFixedTrackHeight + 'px';
        }

        function setTrackHeightFrom(el) {
          if (isMobile()) { track.style.height = ''; return; }
          if (desktopFixedTrackHeight > 0) { track.style.height = desktopFixedTrackHeight + 'px'; return; }
          if (!el) return;
          var h = el.offsetHeight;
          if (h > 0) track.style.height = h + 'px';
        }

        function syncButtons() {
          var multi = Math.ceil(items.length / getPageSize()) > 1;
          if (isMobile() || !multi) {
            if (btnPrev) btnPrev.style.display = 'none';
            if (btnNext) btnNext.style.display = 'none';
            return;
          }
          if (btnPrev) { btnPrev.style.display = ''; btnPrev.disabled = isAnimating; }
          if (btnNext) { btnNext.style.display = ''; btnNext.disabled = isAnimating; }
        }

        function syncMoreButton() {
          if (!moreBtn) return;
          if (!isMobile()) { moreBtn.hidden = true; return; }
          moreBtn.hidden = mobileVisibleCount >= items.length;
        }

        function renderMobile() {
          isAnimating = false;
          track.classList.add('is-mobile');
          track.innerHTML = '';
          items.slice(0, mobileVisibleCount).forEach(function (item) { track.appendChild(buildSlide(item)); });
          track.style.height = '';
          syncButtons();
          syncMoreButton();
        }

        function renderDesktopInitial() {
          track.classList.remove('is-mobile');
          pageCount = Math.max(1, Math.ceil(items.length / getPageSize()));
          if (currentPage > pageCount - 1) currentPage = pageCount - 1;
          if (currentPage < 0) currentPage = 0;
          track.innerHTML = '';
          var page = buildPage(currentPage);
          page.classList.add('is-active');
          track.appendChild(page);
          requestAnimationFrame(function () { measureDesktopFixedHeight(); setTrackHeightFrom(page); });
          syncButtons();
          syncMoreButton();
        }

        function transitionToPage(nextPageIndex, direction) {
          if (isMobile() || isAnimating) return;
          pageCount = Math.max(1, Math.ceil(items.length / getPageSize()));
          nextPageIndex = Math.max(0, Math.min(pageCount - 1, nextPageIndex));
          var currentEl = track.querySelector('.page.is-active');
          if (!currentEl) { currentPage = nextPageIndex; renderDesktopInitial(); return; }
          if (nextPageIndex === currentPage) { syncButtons(); return; }

          isAnimating = true;
          syncButtons();

          var nextEl = buildPage(nextPageIndex);
          nextEl.classList.add('is-abs');
          var enterFrom = direction === 1 ? '100%' : '-100%';
          var leaveTo = direction === 1 ? '-100%' : '100%';

          currentEl.classList.add('is-abs');
          currentEl.style.transform = 'translate3d(0,0,0)';
          nextEl.style.transform = 'translate3d(' + enterFrom + ',0,0)';
          track.appendChild(nextEl);

          if (desktopFixedTrackHeight > 0) track.style.height = desktopFixedTrackHeight + 'px';
          else track.style.height = Math.max(currentEl.offsetHeight || 0, nextEl.offsetHeight || 0) + 'px';

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              currentEl.style.transform = 'translate3d(' + leaveTo + ',0,0)';
              nextEl.style.transform = 'translate3d(0,0,0)';
            });
          });

          var done = false;
          function cleanup() {
            if (done) return;
            done = true;
            currentPage = nextPageIndex;
            currentEl.remove();
            nextEl.classList.remove('is-abs');
            nextEl.classList.add('is-active');
            nextEl.style.transform = 'translate3d(0,0,0)';
            nextEl.style.position = '';
            nextEl.style.inset = '';
            setTrackHeightFrom(nextEl);
            isAnimating = false;
            syncButtons();
            syncMoreButton();
          }
          nextEl.addEventListener('transitionend', function onEnd(e) {
            if (e.propertyName !== 'transform') return;
            nextEl.removeEventListener('transitionend', onEnd);
            cleanup();
          });
          setTimeout(cleanup, 900);
        }

        function render() { if (isMobile()) renderMobile(); else renderDesktopInitial(); }

        function next() {
          if (isMobile() || isAnimating || pageCount < 2) return;
          transitionToPage(currentPage >= pageCount - 1 ? 0 : currentPage + 1, 1);
        }
        function prev() {
          if (isMobile() || isAnimating || pageCount < 2) return;
          transitionToPage(currentPage <= 0 ? pageCount - 1 : currentPage - 1, -1);
        }
        function stopAuto() { if (autoTimer) clearInterval(autoTimer); autoTimer = null; }
        function startAuto() {
          stopAuto();
          if (isMobile() || interval <= 0) return;
          autoTimer = setInterval(function () { if (!isAnimating) next(); }, interval);
        }
        function onMore() { mobileVisibleCount += 5; renderMobile(); }

        function onPointerDown(e) {
          if (isMobile() || isAnimating) return;
          dragStartX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          isDragging = true;
        }
        function onPointerUp(e) {
          if (!isDragging || isMobile() || isAnimating) return;
          var endX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX) || 0;
          var diff = endX - dragStartX;
          if (Math.abs(diff) > 60) { if (diff < 0) next(); else prev(); }
          isDragging = false;
        }

        if (btnPrev) btnPrev.addEventListener('click', prev);
        if (btnNext) btnNext.addEventListener('click', next);
        if (moreBtn) moreBtn.addEventListener('click', onMore);
        section.addEventListener('mouseenter', stopAuto);
        section.addEventListener('mouseleave', startAuto);
        track.addEventListener('mousedown', onPointerDown);
        track.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchend', onPointerUp);

        var resizeTimer = null;
        var wasMobile = isMobile();
        window.addEventListener('resize', function () {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function () {
            var nowMobile = isMobile();
            if (nowMobile && !wasMobile) mobileVisibleCount = 5;
            wasMobile = nowMobile;
            isAnimating = false;
            desktopFixedTrackHeight = 0;
            render();
            startAuto();
          }, 120);
        });

        render();
        startAuto();
      }
    })();
  </script>
</section>
