  <script>
    (function(){
      var root = document.getElementById('htuBoard');
      if(!root || root.__htuInit) return;
      root.__htuInit = true;

      var API = String(window.HTU_CMS_ENDPOINT || '').replace(/\/+$/, '') + '/api/public';
      var mode = root.getAttribute('data-mode');
      if(mode !== 'news' && mode !== 'event') mode = 'notice';
      var box = root.querySelector('.hb-root');
      var qs = new URLSearchParams(location.search);
      var id = qs.get('id') || root.getAttribute('data-id');
      // 검색엔진용 정적 페이지(posts/…html): 한국어면 미리 그려진 본문을 그대로 쓰고 조회수만 올림
      var pre = root.getAttribute('data-id') && box.querySelector('article');
      function whenNeeded(table, render){
        if(!pre) return render();
        (window.HTU_I18N ? window.HTU_I18N.ready : Promise.resolve()).then(function(){
          var l = (window.HTU_I18N && window.HTU_I18N.lang) || 'ko';
          if(l === 'ko') bump(table, id); else render();   /* 다른 언어 → 번역본으로 다시 그림 */
        });
      }
      var page = Math.max(1, parseInt(qs.get('page') || '1', 10) || 1);
      var SITE = document.title.split('|').pop().trim() || 'HTU GLOBAL';

      function esc(s){
        return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
          return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
        });
      }
      function fmt(d, long){
        var t = new Date(d); if(isNaN(t)) return '';
        return t.toLocaleDateString((window.HTU_I18N && window.HTU_I18N.locale) || 'ko-KR', long ? { year:'numeric', month:'long', day:'numeric' } : { year:'numeric', month:'2-digit', day:'2-digit' });
      }
      function get(path){
        return (window.HTU_I18N ? window.HTU_I18N.ready : Promise.resolve()).then(function(){
          return fetch(API + (window.HTU_I18N ? window.HTU_I18N.q(path) : path), { credentials:'omit' });
        }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
      }
      function bump(table, rid){
        var key = 'htu_view_' + table + '_' + rid;
        try{ if(sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); }catch(e){}
        fetch(API + '/view', { method:'POST', headers:{ 'Content-Type':'text/plain' }, body: JSON.stringify({ table:table, id:rid }), credentials:'omit' }).catch(function(){});
      }
      function notFound(back){
        box.innerHTML = '<div class="hb-narrow"><div class="hb-empty">게시물을 찾을 수 없습니다.</div><div class="hb-actions"><a class="hb-btn" href="' + back + '">← 목록으로</a></div></div>';
      }
      var FILE_ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5 12.6 21a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg>';
      function filesHtml(list){
        list = (list || []).filter(function(f){ return f && f.url; });
        if(!list.length) return '';
        return '<div class="hb-files"><h4>첨부파일</h4><ul>' + list.map(function(f){
          return '<li><a href="' + esc(f.url) + '" target="_blank" rel="noopener" download>' + FILE_ICO + esc(f.name || '파일') + '</a></li>';
        }).join('') + '</ul></div>';
      }
      function postUrl(kind, r){ return r.seo_path ? r.seo_path : kind + '.html?id=' + esc(r.id); }
      /* ---------- 게시판 공통: 검색 · 보기 전환 · 번호 페이지 ---------- */
      var Q = (qs.get('q') || '').trim();
      function linkTo(base, extra){
        var u = new URLSearchParams();
        Object.keys(extra).forEach(function(k){ if(extra[k] !== '' && extra[k] != null && !(k === 'page' && +extra[k] === 1)) u.set(k, extra[k]); });
        var s = u.toString(); return base + (s ? '?' + s : '');
      }
      function pagerHtml(base, cur, pages, extra){
        if(pages <= 1) return '';
        var W = 10, start = Math.floor((cur - 1) / W) * W + 1, end = Math.min(pages, start + W - 1), h = '';
        function a(p, label, cls, aria){ return '<a href="' + linkTo(base, Object.assign({}, extra, { page: p })) + '"' + (cls ? ' class="' + cls + '"' : '') + (aria ? ' aria-label="' + aria + '"' : '') + '>' + label + '</a>'; }
        function off(label){ return '<span class="is-off" aria-hidden="true">' + label + '</span>'; }
        h += cur > 1 ? a(1, '«', 'nav', '처음') : off('«');
        h += cur > 1 ? a(cur - 1, '‹', 'nav', '이전') : off('‹');
        for(var p = start; p <= end; p++) h += a(p, p, p === cur ? 'is-on' : '', p + ' 페이지');
        h += cur < pages ? a(cur + 1, '›', 'nav', '다음') : off('›');
        h += cur < pages ? a(pages, '»', 'nav', '마지막') : off('»');
        return '<nav class="hb-pager" aria-label="페이지">' + h + '</nav>';
      }
      var ICO_GRID = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>';
      var ICO_LIST = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>';
      function toolbarHtml(total, opts){
        opts = opts || {};
        return '<div class="hb-toolbar">' +
          '<span class="hb-total">전체 <b>' + total + '</b>건' + (Q ? ' · “' + esc(Q) + '” 검색 결과' : '') + '</span>' +
          '<div class="hb-tools">' +
            '<form class="hb-search" role="search"><input type="search" name="q" value="' + esc(Q) + '" placeholder="검색어 입력" aria-label="검색어"><button type="submit" aria-label="검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button></form>' +
            (opts.views ? '<div class="hb-view" role="group" aria-label="보기 방식">' +
              '<button type="button" data-view="card"' + (opts.view === 'card' ? ' class="is-on" aria-pressed="true"' : ' aria-pressed="false"') + ' title="카드형">' + ICO_GRID + '<span>카드형</span></button>' +
              '<button type="button" data-view="list"' + (opts.view === 'list' ? ' class="is-on" aria-pressed="true"' : ' aria-pressed="false"') + ' title="목록형">' + ICO_LIST + '<span>목록형</span></button>' +
            '</div>' : '') +
          '</div></div>';
      }
      function bindToolbar(base, extra, onView){
        var f = box.querySelector('.hb-search');
        if(f) f.addEventListener('submit', function(e){ e.preventDefault(); location.href = linkTo(base, Object.assign({}, extra, { q: f.q.value.trim(), page: 1 })); });
        box.querySelectorAll('.hb-view button').forEach(function(b){ b.addEventListener('click', function(){ onView(b.getAttribute('data-view')); }); });
      }
      function noThumb(label){ return '<div class="hb-thumb is-empty"><span class="hb-ph">' + label + '</span>'; }
      function article(d, eyebrow, back, extra){
        document.title = (d.seo_title || d.title) + ' | ' + SITE;
        var md = document.querySelector('meta[name="description"]');
        if(md && d.seo_description) md.setAttribute('content', d.seo_description);
        box.innerHTML =
          '<article class="hb-narrow">' +
            '<p class="hb-eyebrow">' + eyebrow + '</p>' +
            '<h1 class="hb-h1">' + esc(d.title) + '</h1>' +
            '<div class="hb-meta"><time datetime="' + esc(d.published_at) + '">' + fmt(d.published_at, true) + '</time></div>' +
            (d.excerpt ? '<p class="hb-lead">' + esc(d.excerpt) + '</p>' : '') +
            (extra || '') +
            (d.thumbnail_url ? '<img class="hb-cover" src="' + esc(d.thumbnail_url) + '" alt="">' : '') +
            '<div class="hb-content">' + (d.content_html || '') + '</div>' +   /* 서버에서 허용 태그만 남기고 정화된 HTML */
            filesHtml(d.attachments) +
            '<div class="hb-actions"><a class="hb-btn" href="' + back + '">← 목록으로</a></div>' +
          '</article>';
      }

      /* ---------- 공지사항 ---------- */
      if(mode === 'notice'){
        if(id){
          whenNeeded('notices', function(){ get('/notices/' + encodeURIComponent(id)).then(function(d){
            if(!d || d.error) return notFound('notice.html');
            article(d, 'Notice', 'notice.html');
            bump('notices', d.id);
          }); });
          return;
        }
        var VKEY = 'htu_notice_view';
        var view = qs.get('view') || (function(){ try{ return localStorage.getItem(VKEY); }catch(e){ return null; } })() || 'card';
        if(view !== 'list') view = 'card';
        get('/notices?page=' + page + (Q ? '&q=' + encodeURIComponent(Q) : '')).then(function(d){
          d = d || { rows:[], count:0, per:12 };
          d.per = d.per || 12;
          d.count = Math.max(d.count || 0, (page - 1) * d.per + d.rows.length);
          var pages = Math.max(1, Math.ceil(d.count / d.per));
          document.title = '공지사항 | ' + SITE;
          function render(){
            var body;
            if(!d.rows.length){
              body = '<div class="hb-empty">' + (Q ? '검색 결과가 없습니다.' : '등록된 공지사항이 없습니다.') + '</div>';
            } else if(view === 'card'){
              body = '<div class="hb-grid">' + d.rows.map(function(r){
                var isNew = Date.now() - new Date(r.published_at).getTime() < 7 * 864e5;
                return '<a class="hb-card" href="' + postUrl('notice', r) + '">' +
                  (r.img ? '<div class="hb-thumb"><span class="hb-ph">Notice</span><img src="' + esc(r.img) + '" alt="" loading="lazy" decoding="async" onerror="this.parentNode.classList.add(\'is-empty\');this.remove()">' : noThumb('Notice')) +
                    '<span class="hb-chip' + (r.pinned ? ' is-pin' : '') + '">' + (r.pinned ? '공지' : '안내') + '</span>' +
                    (isNew ? '<span class="hb-new">NEW</span>' : '') + '</div>' +
                  '<div class="hb-card-body"><h3 class="hb-card-title">' + esc(r.title) + '</h3>' +
                    (r.excerpt ? '<p class="hb-card-ex">' + esc(r.excerpt) + '</p>' : '') +
                    '<div class="hb-card-date">' + fmt(r.published_at) + (r.attachments && r.attachments.length ? ' · 📎 ' + r.attachments.length : '') + '</div></div></a>';
              }).join('') + '</div>';
            } else {
              body = '<ul class="hb-list">' + d.rows.map(function(r, i){
                return '<li class="' + (r.pinned ? 'is-pinned' : '') + '"><a href="' + postUrl('notice', r) + '">' +
                  '<span class="hb-no">' + (r.pinned ? '<em>공지</em>' : (d.count - ((page - 1) * d.per + i))) + '</span>' +
                  '<span class="hb-subject">' + esc(r.title) + (r.attachments && r.attachments.length ? ' <i class="hb-clip" title="첨부파일">📎</i>' : '') + '</span>' +
                  '<span class="hb-date">' + fmt(r.published_at) + '</span></a></li>';
              }).join('') + '</ul>';
            }
            box.innerHTML = '<div class="hb-wrap"><p class="hb-eyebrow">Notice</p><h1 class="hb-h1">공지사항</h1>' +
              toolbarHtml(d.count, { views: true, view: view }) + body +
              pagerHtml('notice.html', page, pages, { q: Q, view: qs.get('view') || '' }) + '</div>';
            bindToolbar('notice.html', { view: qs.get('view') || '' }, function(v){
              view = v; try{ localStorage.setItem(VKEY, v); }catch(e){}
              render();
            });
          }
          render();
        });
        return;
      }

      /* ---------- 이벤트 ---------- */
      if(mode === 'event'){
        var today = new Date(); today.setHours(0,0,0,0);
        function day(v){ if(!v) return null; var p = String(v).slice(0,10).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
        function status(e){
          var s0 = day(e.start_date), s1 = day(e.end_date) || s0;
          if(s0 && today < s0) return { key:'soon', label:'예정' };
          if(s1 && today > s1) return { key:'end', label:'종료' };
          return { key:'on', label:'진행중' };
        }
        function period(e){
          var a = e.start_date ? fmt(e.start_date) : '', b = e.end_date ? fmt(e.end_date) : '';
          return a && b && a !== b ? a + ' ~ ' + b : (a || b);
        }
        if(id){
          whenNeeded('events', function(){ get('/events/' + encodeURIComponent(id)).then(function(d){
            if(!d || d.error) return notFound('event.html');
            if(d.link_type === 'external' && d.external_url){ location.replace(d.external_url); return; }
            var stt = status(d);
            var info = '<dl class="hb-evinfo">' +
              '<dt>상태</dt><dd>' + stt.label + '</dd>' +
              (period(d) ? '<dt>기간</dt><dd>' + period(d) + '</dd>' : '') +
              (d.location ? '<dt>장소</dt><dd>' + esc(d.location) + '</dd>' : '') + '</dl>' +
              (d.apply_url ? '<a class="hb-apply' + (stt.key === 'end' ? ' is-disabled' : '') + '" href="' + esc(d.apply_url) + '" target="_blank" rel="noopener noreferrer">' +
                (stt.key === 'end' ? '마감되었습니다' : esc(d.apply_label || '신청하기') + ' ↗') + '</a>' : '');
            d.excerpt = d.summary;
            article(d, 'Event', 'event.html', info);
            bump('events', d.id);
          }); });
          return;
        }
        get('/events').then(function(d){
          var rows = (d && d.rows) || [];
          document.title = '이벤트 | ' + SITE;
          var filter = qs.get('status') || 'all';
          function render(){
            var all = rows.filter(function(e){ return (filter === 'all' || status(e).key === filter) && (!Q || (e.title + ' ' + (e.summary || '') + ' ' + (e.location || '')).toLowerCase().indexOf(Q.toLowerCase()) >= 0); });
            var PER = 12, pages = Math.max(1, Math.ceil(all.length / PER)), cur = Math.min(page, pages);
            var list = all.slice((cur - 1) * PER, cur * PER);
            var cards = list.map(function(e){
              var stt = status(e);
              var external = e.link_type === 'external' && e.external_url;
              var href = external ? esc(e.external_url) : postUrl('event', e);
              return '<a class="hb-card' + (stt.key === 'end' ? ' is-end' : '') + '" href="' + href + '"' + (external ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' +
                '<div class="hb-thumb">' + (e.thumbnail_url ? '<img src="' + esc(e.thumbnail_url) + '" alt="" loading="lazy">' : '') +
                  '<span class="hb-status is-' + stt.key + '">' + stt.label + '</span>' + (external ? '<span class="hb-chip">외부 링크 ↗</span>' : '') + '</div>' +
                '<div class="hb-card-body"><h3 class="hb-card-title">' + esc(e.title) + '</h3>' +
                  (e.summary ? '<p class="hb-card-ex">' + esc(e.summary) + '</p>' : '') +
                  '<div class="hb-card-meta">' + (period(e) ? '<span>📅 ' + period(e) + '</span>' : '') + (e.location ? '<span>📍 ' + esc(e.location) + '</span>' : '') + '</div>' +
                '</div></a>';
            }).join('');
            var tabs = [['all','전체'],['on','진행중'],['soon','예정'],['end','종료']].map(function(t){
              return '<button type="button" data-st="' + t[0] + '"' + (t[0] === filter ? ' class="is-on"' : '') + '>' + t[1] + '</button>';
            }).join('');
            box.innerHTML = '<div class="hb-wrap"><p class="hb-eyebrow">Event</p><h1 class="hb-h1">이벤트</h1><div class="hb-tabs">' + tabs + '</div>' +
              toolbarHtml(all.length) +
              (cards ? '<div class="hb-grid">' + cards + '</div>' : '<div class="hb-empty">' + (Q ? '검색 결과가 없습니다.' : '해당하는 이벤트가 없습니다.') + '</div>') +
              pagerHtml('event.html', cur, pages, { q: Q, status: filter === 'all' ? '' : filter }) + '</div>';
            bindToolbar('event.html', { status: filter === 'all' ? '' : filter }, function(){});
            box.querySelectorAll('.hb-tabs button').forEach(function(b){
              b.addEventListener('click', function(){
                filter = b.getAttribute('data-st');
                history.replaceState(null, '', linkTo('event.html', { status: filter === 'all' ? '' : filter, q: Q }));
                page = 1; render();
              });
            });
          }
          render();
        });
        return;
      }

      /* ---------- News & Event ---------- */
      if(id){
        whenNeeded('news', function(){ get('/news/' + encodeURIComponent(id)).then(function(d){
          if(!d || d.error) return notFound('news.html');
          if(d.type === 'external' && d.external_url){ location.replace(d.external_url); return; }
          article(d, 'News &amp; Event', 'news.html');
          bump('news', d.id);
        }); });
        return;
      }
      get('/news').then(function(d){
        var all = ((d && d.rows) || []).filter(function(n){ return !Q || (n.title + ' ' + (n.excerpt || '')).toLowerCase().indexOf(Q.toLowerCase()) >= 0; });
        document.title = 'News & Event | ' + SITE;
        var PER = 12, pages = Math.max(1, Math.ceil(all.length / PER)), cur = Math.min(page, pages);
        var rows = all.slice((cur - 1) * PER, cur * PER);
        var cards = rows.map(function(n){
          var internal = n.type === 'internal';
          var href = internal ? postUrl('news', n) : esc(n.external_url || '#');
          var target = internal ? '' : ' target="_blank" rel="noopener noreferrer"';
          return '<a class="hb-card" href="' + href + '"' + target + '>' +
            '<div class="hb-thumb">' + (n.thumbnail_url ? '<img src="' + esc(n.thumbnail_url) + '" alt="" loading="lazy">' : '') +
              '<span class="hb-chip' + (internal ? ' is-internal' : '') + '">' + (internal ? 'HTU 소식' : '외부 기사 ↗') + '</span></div>' +
            '<div class="hb-card-body"><h3 class="hb-card-title">' + esc(n.title) + '</h3>' +
              (n.excerpt ? '<p class="hb-card-ex">' + esc(n.excerpt) + '</p>' : '') +
              '<div class="hb-card-date">' + fmt(n.published_at) + '</div></div></a>';
        }).join('');
        box.innerHTML = '<div class="hb-wrap"><p class="hb-eyebrow">News &amp; Event</p><h1 class="hb-h1">News &amp; Event</h1>' +
          toolbarHtml(all.length) +
          (cards ? '<div class="hb-grid">' + cards + '</div>' : '<div class="hb-empty">' + (Q ? '검색 결과가 없습니다.' : '등록된 소식이 없습니다.') + '</div>') +
          pagerHtml('news.html', cur, pages, { q: Q }) + '</div>';
        bindToolbar('news.html', {}, function(){});
      });
    })();
  </script>
</section>
